domain: INFRA
type: NETWORK_DEVICE
# Generic fallback type. Synthesized ONLY from LLDP data when the device could not be
# classified (deviceType omitted). Hosts (deviceType: host) and typed devices
# (deviceType: ap|switch|gateway) do NOT match this rule, so there are no duplicates.
# There is intentionally no `Networking`-event rule here — that source always supplies
# a deviceType.
synthesis:
  rules:
    - ruleName: networkDeviceFromLldpUnclassified
      identifier: lldpLocChassisId
      name: device_name
      encodeIdentifierInGUID: false
      conditions:
        - attribute: metricName
          value: kentik.snmp.lldpLocChassisId
        - attribute: lldpLocChassisId
          present: true
        - attribute: deviceType
          present: false
      tags:
        lldpLocChassisId:
          entityTagName: mac
        device_name:
          entityTagName: hostname
        src_addr:
          entityTagName: ipAddress
        vendor:
          entityTagName: vendor
        model:
          entityTagName: model

goldenTags:
  - vendor
  - model

ownership:
  primaryOwner:
    teamName: "Network Monitoring"
