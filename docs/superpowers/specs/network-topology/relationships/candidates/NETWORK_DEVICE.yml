category: NETWORK_DEVICE
lookups:
  - entityTypes:
      - domain: INFRA
        type: NETWORK_AP
      - domain: INFRA
        type: NETWORK_SWITCH
      - domain: INFRA
        type: NETWORK_GATEWAY
      - domain: INFRA
        type: NETWORK_DEVICE        # generic fallback type (LLDP-only unclassified)
      - domain: INFRA
        type: HOST                  # existing INFRA-HOST, for device->host links
    tags:
      matchingMode: ANY
      predicates:
        # Primary key: the device MAC. NETWORK_* entities expose `mac`; INFRA-HOST may too.
        - tagKeys: ["mac"]
          field: mac
        # Fallback: match a host (or named device) by hostname. Chiefly to reach
        # INFRA-HOST when it has no matching `mac` tag. Confirm the real INFRA-HOST
        # name tag key during implementation.
        - tagKeys: ["hostname", "host.name"]
          field: hostname
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
