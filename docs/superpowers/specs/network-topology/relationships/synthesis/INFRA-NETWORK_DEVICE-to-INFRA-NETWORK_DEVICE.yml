relationships:
  # =====================================================================================
  # Source 1 — custom `Networking` event.
  # Source resolved from the event's own entity.guid; target resolved by dstMac.
  # =====================================================================================
  - name: networkingDeviceConnectsToDevice
    version: "1"
    origins:
      - Event API
    conditions:
      - attribute: eventType
        anyOf: ["Networking"]
      - attribute: dstMac
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: dstMac

  # =====================================================================================
  # Source 2 — LLDP over SNMP (Kentik ktranslate).
  # SOURCE = buildGuid per local deviceType (typed) or generic (deviceType absent).
  # TARGET = lookupGuid by neighbor MAC (then hostname, mainly to reach INFRA-HOST).
  # Hosts carry deviceType: host and match NO source rule -> device->host only.
  # =====================================================================================
  - name: lldpSwitchConnectsToDevice
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        anyOf: ["switch"]
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: NETWORK_SWITCH
          identifier:
            fragments:
              - attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  - name: lldpGatewayConnectsToDevice
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        anyOf: ["gateway"]
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: NETWORK_GATEWAY
          identifier:
            fragments:
              - attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  - name: lldpApConnectsToDevice
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        anyOf: ["ap"]
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: NETWORK_AP
          identifier:
            fragments:
              - attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  # Generic: deviceType absent -> build NETWORK_DEVICE (matches the §7.4 fallback entity).
  - name: lldpGenericDeviceConnectsToDevice
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        present: false
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: NETWORK_DEVICE
          identifier:
            fragments:
              - attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  # -------------------------------------------------------------------------------------
  # LLDP lookupGuid twins — robustness fallback. Same conditions as the build rules, but
  # the SOURCE is resolved from the entity index by MAC instead of being built. Identical
  # edges dedupe with the build rules. They carry the same deviceType match, so hosts
  # (deviceType: host) still match no source rule (device->host only).
  # -------------------------------------------------------------------------------------
  - name: lldpSwitchConnectsToDeviceLookup
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        anyOf: ["switch"]
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  - name: lldpGatewayConnectsToDeviceLookup
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        anyOf: ["gateway"]
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  - name: lldpApConnectsToDeviceLookup
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        anyOf: ["ap"]
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName

  - name: lldpGenericDeviceConnectsToDeviceLookup
    version: "1"
    origins:
      - Network Monitoring
    conditions:
      - attribute: metricName
        anyOf: ["kentik.snmp.lldpRemSysName", "kentik.snmp.lldpRemChassisId"]
      - attribute: deviceType
        present: false
      - attribute: lldpLocChassisId
        present: true
      - attribute: lldpRemChassisId
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpLocChassisId
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: lldpRemChassisId
            - field: hostname
              attribute: lldpRemSysName
