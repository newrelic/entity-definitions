relationships:
  - name: extServiceCallsGenericDatabase
    version: "1"
    entitlements:
      matching: anyOf
      values:
        - auto_discovery_entities_ccu
        - auto_discovery_entities_ccu_discount_usage
        - azure_auto_discovery
        - azure_auto_discovery_discount_usage
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: db.system.name
        anyOf: [ "postgresql", "mysql", "microsoft.sql_server", "mongodb" ]
      - attribute: server.address
        present: true
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: DATABASE
          fields:
            - field: endpoint
              attribute: server.address

  # Same rule, sourced from the older (pre db.system.name) db.system semconv attribute --
  # still what several current instrumentation libraries emit (confirmed live against real
  # Node auto-instrumentation spans, e.g. @opentelemetry/instrumentation-{pg,mongodb}).
  # Without this, a Span carrying only "db.system" (not "db.system.name") never matches the
  # rule above and gets no database CALLS relationship at all -- not just for
  # Redis/Mongo, but for Postgres/MySQL/MSSQL too, on any instrumentation version still on
  # the older attribute name. mssql's db.system value ("mssql") differs from its
  # db.system.name value ("microsoft.sql_server").
  - name: extServiceCallsGenericDatabaseLegacySemconv
    version: "1"
    entitlements:
      matching: anyOf
      values:
        - auto_discovery_entities_ccu
        - auto_discovery_entities_ccu_discount_usage
        - azure_auto_discovery
        - azure_auto_discovery_discount_usage
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: db.system
        anyOf: [ "postgresql", "mysql", "mssql", "mongodb" ]
      - attribute: server.address
        present: true
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: DATABASE
          fields:
            - field: endpoint
              attribute: server.address
