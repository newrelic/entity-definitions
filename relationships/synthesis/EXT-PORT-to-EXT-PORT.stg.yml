relationships:
  - name: extPortConnectsToPortByMac
    version: "1"
    origins: [Network Monitoring]
    conditions:
      - attribute: eventType
        anyOf: ["NetworkTopology"]
      - attribute: networkEntityType
        anyOf: ["PORT"]
      - attribute: deviceName
        present: true
      - attribute: port
        present: true
      - attribute: dstPort
        present: true
      - attribute: dstMac
        present: true
    relationship:
      expires: PT30M
      relationshipType: CONNECTS_TO
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: NETWORK_PORT
          fields:
            - field: deviceMac
              attribute: dstMac
            - field: port
              attribute: dstPort

  - name: extPortConnectsToPortByManagementIp
    version: "1"
