relationships:
  - name: extPortConnectsToPortByMac
    version: "1"
    origins: [Network Monitoring]
    conditions:
      - attribute: deviceName
        present: true
      - attribute: port
        present: true
      - attribute: dstPort
        present: true
      - attribute: dstMac
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: EXT
          type:
            value: PORT
          identifier:
            fragments:
              - attribute: deviceName
              - value: ":"
              - attribute: port
            hashAlgorithm: FARM_HASH
      target:
        lookupGuid:
          candidateCategory: NETWORK_PORT
          fields:
            - field: deviceMac
              attribute: dstMac
            - field: port
              attribute: dstPort

  - name: extPortConnectsToPortByManagementIp
