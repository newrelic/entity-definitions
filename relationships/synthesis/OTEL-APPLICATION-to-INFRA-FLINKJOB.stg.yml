relationships:
  # STAGING ONLY.
  # OpenTelemetry-instrumented application (the Flink job's own code, or a service that
  # tags its spans with the job it belongs to) -> INFRA FLINKJOB. The app sets the resource
  # attributes flink.job.name and k8s.cluster.name; the FLINKJOB candidate resolves them to the
  # job entity, native or OTel.
  - name: otelApplicationCallsFlinkJobFromTraces
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: newrelic.source
        anyOf: ["api.traces.otlp"]
      - attribute: flink.job.name
        present: true
      - attribute: k8s.cluster.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: FLINKJOB
          fields:
            - field: jobName
              attribute: flink.job.name
            - field: clusterName
              attribute: k8s.cluster.name
