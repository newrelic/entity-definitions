# Device CONTAINS Port — EXT-only. Design: docs/superpowers/specs/2026-07-08-network-topology-ext-only.md
#
# SOURCE = buildGuid(EXT, <extType>, device_name) — the owning EXT device node.
# TARGET = buildGuid(EXT, PORT, device_name:port) — the near EXT/PORT node, deterministic.
# One rule for all device types (source type from `extType`).
relationships:
  - name: extDeviceContainsPort
    version: "1"
    origins: [Event API]
    conditions:
      - { attribute: eventType,   anyOf: ["Networking"] }
      - { attribute: extType,     present: true }
      - { attribute: device_name, present: true }
      - { attribute: port,        present: true }
    relationship:
      expires: PT75M
      relationshipType: CONTAINS
      source:
        buildGuid:
          account: { attribute: accountId }
          domain:  { value: EXT }
          type:    { attribute: extType }
          identifier:
            fragments: [ { attribute: device_name } ]
            hashAlgorithm: FARM_HASH
      target:
        buildGuid:
          account: { attribute: accountId }
          domain:  { value: EXT }
          type:    { value: PORT }
          identifier:
            fragments: [ { attribute: device_name }, { value: ":" }, { attribute: port } ]
            hashAlgorithm: FARM_HASH
