# Direction comes from messaging.operation[.type], not span.kind. Two rule pairs cover the semconv v1.26 rename.
relationships:
  - name: otelServiceProducesIbmmqManager1_25
    version: "1"
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: newrelic.source
        anyOf: [ "api.traces.otlp" ]
      - attribute: instrumentation.provider
        anyOf: [ "opentelemetry" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: messaging.system
        anyOf: [ "ibmmq" ]
      - attribute: messaging.ibmmq.queue_manager.id
        present: true
      - attribute: messaging.operation
        anyOf: [ "publish" ]
    relationship:
      expires: PT75M
      relationshipType: PRODUCES
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: IBMMQ_MANAGER
          fields:
            - field: queueManagerId
              attribute: messaging.ibmmq.queue_manager.id
            - field: instrumentationProvider
              attribute: instrumentation.provider

  - name: otelServiceConsumesIbmmqManager1_25
    version: "1"
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: newrelic.source
        anyOf: [ "api.traces.otlp" ]
      - attribute: instrumentation.provider
        anyOf: [ "opentelemetry" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: messaging.system
        anyOf: [ "ibmmq" ]
      - attribute: messaging.ibmmq.queue_manager.id
        present: true
      - attribute: messaging.operation
        anyOf: [ "receive", "process", "deliver" ]
    relationship:
      expires: PT75M
      relationshipType: CONSUMES
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: IBMMQ_MANAGER
          fields:
            - field: queueManagerId
              attribute: messaging.ibmmq.queue_manager.id
            - field: instrumentationProvider
              attribute: instrumentation.provider

