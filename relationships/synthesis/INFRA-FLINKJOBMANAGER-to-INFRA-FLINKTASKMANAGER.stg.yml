relationships:
  # JobManager manages TaskManager
  # Native (nri-flink, REMOTE_MONITORING=true). The sample's own entity is the target (entityGuid: with overrideGuidType the entity GUID is the row's
  # entityGuid with the type segment swapped from NA).
  # The source JobManager GUID is rebuilt from its entity key "flink-jobmanager:<host:port>"
  # (jobmanager.endpoint, added by nri-flink to every remote sample), hashed with FARM_HASH.
  # UNVERIFIED: assumes the JobManager entityId equals FARM_HASH of that key. Not reproduced with go-farm
  # (an ordinary Host's entityId does not match FARM_HASH(entityKey) either), so confirm the recipe with Entity Platform.
  - name: nriFlinkJobManagerManagesTaskManager
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["FlinkTaskManagerSample"]
      - attribute: entityType
        anyOf: ["FLINKTASKMANAGER"]
      - attribute: jobmanager.endpoint
        present: true
    relationship:
      expires: PT75M
      relationshipType: MANAGES
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: FLINKJOBMANAGER
          identifier:
            fragments:
              - value: "flink-jobmanager:"
              - attribute: jobmanager.endpoint
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: FLINKTASKMANAGER
