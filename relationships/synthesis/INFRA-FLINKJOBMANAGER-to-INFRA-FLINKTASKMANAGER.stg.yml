relationships:
  # JobManager manages TaskManager
  # Native (nri-flink, REMOTE_MONITORING=true). The sample's own entity is the target (entityGuid: with
  # overrideGuidType the entity GUID is the row's entityGuid, account|INFRA|NA|<entityId>).
  # The source JobManager GUID is rebuilt from its entity key "flink-jobmanager:<host:port>"
  # (jobmanager.endpoint, added by nri-flink to every remote sample), hashed with FARM_HASH. The JobManager
  # entityId is FARM_HASH of that key (verified in staging) and its GUID type segment is NA (valueInGuid).
  # Infra samples carry no entityType attribute, so the rule matches on eventType.
  - name: nriFlinkJobManagerManagesTaskManager
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["FlinkTaskManagerSample"]
      - attribute: jobmanager.endpoint
        present: true
    relationship:
      expires: PT75M
      relationshipType: MANAGES
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: FLINKJOBMANAGER
            valueInGuid: NA
          identifier:
            fragments:
              - value: "flink-jobmanager:"
              - attribute: jobmanager.endpoint
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: FLINKTASKMANAGER
