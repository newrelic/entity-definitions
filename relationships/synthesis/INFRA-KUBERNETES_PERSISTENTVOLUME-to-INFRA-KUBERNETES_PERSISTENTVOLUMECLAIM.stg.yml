relationships:
  # [STG] The OTel rule's built side pins the account to the datapoint's accountId instead of `lookup: true`.
  # A lookup searches the whole trusted account and drops the edge when the GUID exists in 2+ accounts
  # (mirrored telemetry, e.g. cluster test-odd-wire in accounts 754495 and 1).
  # [STG] The nri PV -> PVC rule is removed: the PVC -> PV nri rule (INFRA-KUBERNETES_PERSISTENTVOLUMECLAIM-to-
  # INFRA-KUBERNETES_PERSISTENTVOLUME) already covers the pair, and it matches the design doc (PVC manages PV).
  # The OTel PV -> PVC rule stays because the OTel PVC -> PV rule currently produces no edges.
  - name: otelKsmK8sPersistentVolumeManagesPersistentVolumeClaim
    # use kube-state-metrics kube_job_owner metric
    version: "1"
    origins: 
      - OpenTelemetry
    conditions:
      - attribute: metricName
        anyOf: [ "kube_persistentvolume_claim_ref" ]
    relationship:
      expires: PT75M
      relationshipType: MANAGES
      source:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KUBERNETES_PERSISTENTVOLUME
      target:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: KUBERNETES_PERSISTENTVOLUMECLAIM
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: claim_namespace
              - value: ":"
              - attribute: name
            hashAlgorithm: FARM_HASH
