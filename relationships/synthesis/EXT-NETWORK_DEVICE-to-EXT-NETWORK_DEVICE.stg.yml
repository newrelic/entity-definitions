relationships:
  - name: extSwitchConnectsToDeviceByMac
    version: "1"
    origins: [Network Monitoring]
    conditions:
      - attribute: eventType
        anyOf: ["NetworkTopology"]
      - attribute: networkEntityType
        anyOf: ["SWITCH"]
      - attribute: deviceName
        present: true
      - attribute: dstName
        present: true
      - attribute: dstPort
        present: false   # fallback: no neighbour port → no port chain
      - attribute: dstMac
        present: true
    relationship:
      expires: PT30M
      relationshipType: CONNECTS_TO
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: dstMac

