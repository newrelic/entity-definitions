relationships:
  - name: extMemberContainedByStack
    version: "1"
    origins: [Network Monitoring]
    conditions:
      - attribute: eventType
        anyOf: ["NetworkTopology"]
      - attribute: networkEntityType
        anyOf: ["SWITCH", "ROUTER", "ACCESS_POINT", "NETWORK_DEVICE"]
      - attribute: deviceName
        present: true
      - attribute: identifier
        present: true
      - attribute: normalizedStackName
        present: true
    relationship:
      expires: PT30M
      relationshipType: CONTAINS
      source:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: normalizedName
              attribute: normalizedStackName
      target:
        extractGuid:
          attribute: entity.guid
