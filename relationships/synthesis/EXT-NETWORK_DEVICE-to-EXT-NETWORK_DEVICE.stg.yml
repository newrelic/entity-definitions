relationships:
  - name: extSwitchConnectsToDeviceByMac
    version: "1"
    origins: [Event API]
    conditions:
      - attribute: eventType
        anyOf: ["NetworkTopology"]
      - attribute: networkEntityType
        anyOf: ["SWITCH"]
      - attribute: deviceName
        present: true
      - attribute: dstName
        present: true
      - attribute: dstPort
        present: false   # fallback: no neighbour port → no port chain
      - attribute: dstMac
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONNECTS_TO
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: EXT
          type:
            value: SWITCH
          identifier:
            fragments:
              - attribute: deviceName
            hashAlgorithm: FARM_HASH
      target:
        lookupGuid:
          candidateCategory: NETWORK_DEVICE
          fields:
            - field: mac
              attribute: dstMac

