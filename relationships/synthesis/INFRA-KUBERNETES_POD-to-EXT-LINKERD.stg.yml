relationships:
  # OTel: each meshed pod CONTAINS its (deployment-level) Linkerd proxy entity.
  # Source POD guid built from cluster:namespace:pod; target = the metric's own entity.guid
  # (the EXT/LINKERD entity synthesized per k8s.cluster:namespace:deployment). Mirrors
  # INFRA-KUBERNETES_POD-to-EXT-ISTIO_SERVICE.stg.yml.
  - name: k8sPodContainsExtLinkerdOtelStg
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: linkerd_control_plane_ns
        present: true
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: k8s.cluster.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.pod.name
        present: true
      - attribute: k8s.deployment.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONTAINS
      source:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: KUBERNETES_POD
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pod.name
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
