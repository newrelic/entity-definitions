relationships:
  # Owned by: Cloud Monitoring Platform
  - name: apmCallsLambdaAlias
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: cloud.platform
        anyOf: [ "aws_lambda"]
      - attribute: cloud.resource_id
        regex: "^arn:aws(?:-us-gov)?:lambda:([^:]*):([^:]*):function:([^:]*):([^/]*)$"
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSLAMBDAALIAS
          fields:
            - field: awsLambdaAliasArn
              attribute: cloud.resource_id