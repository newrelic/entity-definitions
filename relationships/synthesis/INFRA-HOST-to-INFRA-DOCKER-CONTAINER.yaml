relationships:
  # infra metrics from OTel dockerstats receiver
  - name: hostHostsOtelInfraDockerContainer
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric"]
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: host.id
        present: true
      - attribute: metricName
        startsWith: "container."
      # if k8s.cluster.name is present, this is a k8s node reporting a pod's
      # container metrics, which is already covered by Pod<>Container (and
      # Host/Node<>Pod) - keep this rule for non-k8s hosts only
      - attribute: k8s.cluster.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: host.id
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: CONTAINER

