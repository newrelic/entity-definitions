relationships:
  # STAGING ONLY. NR-590130 — APM app -> AWS interface VPC endpoint (PrivateLink), generic.
  #
  # Fires when the app calls through an interface VPC endpoint with private DNS OFF, for BOTH
  # AWS managed services and customer "VPC Service" endpoints — both emit the endpoint DNS
  #   vpce-<id>-<hash>[.<az>].<svc>.<region>.vpce.amazonaws.com
  # The regex is scoped to that AWS DNS suffix (not fully host-free) so the DATABASE-style
  # onMiss typed stub in the candidate can never over-stamp arbitrary hosts.
  #
  # Two variants: timeslice metric (External/<host>/all — unsampled, guaranteed) and Span
  # (server.address — sampled). Both resolve the same candidate field.
  #
  # Inert until the companion ACF change publishes aws.vpce.dnsName on the entity (see the
  # candidate file header). Coexists with any future prod rule (distinct staging name).
  #
  # VERIFIED 2026-07-31 on the vpce-test-infra rig (NR staging APM acct 686923): with interface
  # endpoint private DNS OFF the Java agent emitted BOTH Span server.address and the
  # External/<host>/all timeslice for the AWS-managed (SQS) and customer VPC-Service endpoints,
  # both matching these regexes; the Route53 custom-domain (svc.vpce-test.internal) emitted the
  # friendly host verbatim and correctly did NOT match (deferral, same as MQ/Redis Route53).
  - name: apmApplicationCallsPrivateLinkEndpointByHostStaging
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: ["Span"]
      - attribute: server.address
        regex: "^vpce-[a-z0-9]+-[a-z0-9]+.*\\.vpce\\.amazonaws\\.com$"
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSPRIVATELINKENDPOINT
          fields:
            - field: serverAddress
              attribute: server.address
  - name: apmApplicationCallsPrivateLinkEndpointByMetricStaging
    version: "1"
    origins:
      - APM Metrics
    conditions:
      - attribute: metricName
        # "External/$host/all" — metricName__2 = host
        regex: "^External/vpce-[a-z0-9]+-[a-z0-9]+.*\\.vpce\\.amazonaws\\.com/all$"
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSPRIVATELINKENDPOINT
          fields:
            - field: serverAddress
              attribute: metricName__2
