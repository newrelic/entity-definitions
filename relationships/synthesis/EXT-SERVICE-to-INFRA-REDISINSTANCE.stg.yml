relationships:
  - name: extServiceCallsRedisInstance
    version: "1"
    origins:
      - OpenTelemetry
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Metric" ]
      - attribute: instrumentation.provider
        anyOf: [ "opentelemetry", "newrelic-ebpf" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: db.system
        anyOf: ["redis"]
      - attribute: redis.instance.id
        present: true
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: REDISINSTANCE
          identifier:
            fragments:
              - attribute: redis.instance.id
            hashAlgorithm: FARM_HASH

  - name: extServiceCallsRedisInstance2
    version: "1"
    origins:
      - OpenTelemetry
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Metric" ]
      - attribute: instrumentation.provider
        anyOf: [ "opentelemetry", "newrelic-ebpf" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: db.system
        anyOf: ["redis"]
      - attribute: server.address
        present: true
      - attribute: server.port
        present: true
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: REDIS
          fields:
            - field: host
              attribute: host.name
            - field: endpoint
              attribute: server.address
            - field: port
              attribute: server.port
