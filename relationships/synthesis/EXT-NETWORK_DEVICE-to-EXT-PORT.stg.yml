relationships:
  - name: extSwitchContainsPort
    version: "1"
    origins: [Network Monitoring]
    conditions:
      - attribute: eventType
        anyOf: ["NetworkTopology"]
      - attribute: networkEntityType
        anyOf: ["SWITCH"]
      - attribute: deviceName
        present: true
      - attribute: port
        present: true
    relationship:
      expires: PT30M
      relationshipType: CONTAINS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: EXT
          type:
            value: PORT
          identifier:
            fragments:
              - attribute: normalizedDeviceName
              - value: ":"
              - attribute: port
            hashAlgorithm: FARM_HASH

