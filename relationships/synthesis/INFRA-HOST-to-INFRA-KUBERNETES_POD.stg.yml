relationships:
  - name: k8sHostHostsPod
    # reportingAgent is the entityKey of the HOST entity the reporting agent
    # represents, so the node GUID can be built directly - no candidate lookup.
    # This holds whichever identity the agent resolved (cloud instance id,
    # machine-id or hostname fallback), which is why no fullHostname fallback
    # rule is needed here.
    version: "1"
    origins:
      - Kubernetes Integration
    conditions:
      - attribute: eventType
        anyOf: [ "K8sPodSample" ]
      # Pending pods are surfaced by the KSM scraper with nodeName="", and their
      # reportingAgent is the KSM node rather than the pod's node. Skip them.
      - attribute: nodeName
        regex: ".+"
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: reportingAgent
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: KUBERNETES_POD
  - name: otelKsmK8sHostHostsPod
    # kube-state-metrics kube_pod_info: one row per pod per scrape, and it
    # carries the pod's own entity.guid so the target needs no lookup. The host
    # side does need one - kube_pod_info names the node only by k8s.node.name,
    # while the OTel HOST identifier is host.id, so the host GUID cannot be
    # built from this datapoint. Cost is bounded: kube_pod_info is ~0.05% of
    # K8sPodSample volume, so this lookup is immaterial next to the Kubernetes
    # Integration rule above.
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: metricName
        anyOf: [ "kube_pod_info" ]
      # regex rather than `present: true`: 3% of kube_pod_info rows carry
      # k8s.node.name="" (unscheduled pods), which `present` does not screen
      # and which would look up the empty string.
      - attribute: k8s.node.name
        regex: ".+"
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        lookupGuid:
          candidateCategory: HOST
          fields:
            - field: host.name
              attribute: k8s.node.name
            - field: cluster.name
              attribute: k8s.cluster.name
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KUBERNETES_POD
