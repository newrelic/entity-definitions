relationships:
  - name: k8sHostHostsPod
    version: "1"
    origins:
      - Kubernetes Integration
    conditions:
      - attribute: eventType
        anyOf: [ "K8sPodSample" ]
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        lookupGuid:
          candidateCategory: HOST
          fields:
            - field: host.name
              attribute: nodeName
            - field: cluster.name
              attribute: clusterName
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: KUBERNETES_POD
  - name: otelKsmK8sHostHostsPod
    # use kube-state-metrics kube_pod_info metric - one row per pod per
    # scrape (cheaper to match than every system.* metric), and it carries
    # the pod's own entity.guid directly so the target needs no lookup
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: metricName
        anyOf: [ "kube_pod_info" ]
      - attribute: k8s.node.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        lookupGuid:
          candidateCategory: HOST
          fields:
            - field: host.name
              attribute: k8s.node.name
            - field: cluster.name
              attribute: k8s.cluster.name
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KUBERNETES_POD
