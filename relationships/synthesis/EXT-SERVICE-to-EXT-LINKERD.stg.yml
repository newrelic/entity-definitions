relationships:
  # Prerequisites:
  #   - k8sattributes/traces processor extracts linkerd_control_plane_ns from the
  #     linkerd.io/control-plane-ns pod label onto every meshed pod's spans.
  #   - Downward-API MY_POD_IP + otel.resource.attributes ensures entity.guid on
  #     spans resolves to the correct EXT:SERVICE, not the collector pod.
  - name: extServiceOperatesInExtLinkerdStg
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: ["Span"]
      # Pod is Linkerd-meshed (injector sets linkerd.io/control-plane-ns on every meshed pod)
      - attribute: linkerd_control_plane_ns
        present: true
      # Exclude Linkerd control-plane pods themselves (destination, identity, proxy-injector)
      - attribute: linkerd_control_plane_component
        present: false
      - attribute: k8s.cluster.name
        present: true
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
    relationship:
      expires: PT75M
      relationshipType: OPERATES_IN
      source:
        extractGuid:
          attribute: entity.guid
      target:
        buildGuid:
          account:
            lookup: true
          domain:
            value: EXT
          type:
            value: LINKERD
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: linkerd_control_plane_ns
            hashAlgorithm: FARM_HASH
