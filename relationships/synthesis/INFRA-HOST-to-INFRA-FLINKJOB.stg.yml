relationships:
  - name: oTelHostHostsFlinkJob
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric"]
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: host.id
        present: true
      - attribute: entity.type
        anyOf: ["FLINKJOB"]
      - attribute: k8s.pod.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: host.id
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: FLINKJOB

  # Host measures Job.
  # Native (nri-flink, REMOTE_MONITORING=true): the agent host that runs nri-flink measures the
  # remote Flink Job. Same pattern as hostMonitorsKafkaBrokerProd in INFRA-HOST-to-INFRA-KAFKABROKER
  # (host GUID rebuilt from reportingAgent, with a fullHostname fallback rule).
  - name: nriFlinkHostMeasuresJob
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["FlinkJobSample"]
      - attribute: entityType
        anyOf: ["FLINKJOB"]
      - attribute: reportingAgent
        present: true
    relationship:
      expires: PT75M
      relationshipType: MEASURES
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: reportingAgent
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: FLINKJOB
  - name: nriFlinkHostMeasuresJobRule2
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["FlinkJobSample"]
      - attribute: entityType
        anyOf: ["FLINKJOB"]
      - attribute: fullHostname
        present: true
    relationship:
      expires: PT75M
      relationshipType: MEASURES
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: fullHostname
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: FLINKJOB
