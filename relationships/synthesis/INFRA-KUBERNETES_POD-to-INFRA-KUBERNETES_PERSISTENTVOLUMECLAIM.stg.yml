relationships:
  # This rule relates a Pod to a PersistentVolumeClaim by joining K8sVolumeSample (for podName, pvcName, etc.)
  # with K8sPersistentVolumeClaimSample (for PVC entity construction). The synthesis engine must support
  # cross-sample field extraction by matching on pvcName, namespaceName, and clusterName.
  - name: K8sPodConsumesPersistentVolumeClaim
    version: "1"
    origins:
      - Kubernetes Integration
    conditions:
      - attribute: event_type
        anyOf: [ "K8sVolumeSample" ]
      - attribute: clusterName
        present: true
      - attribute: namespaceName
        present: true
      - attribute: podName
        present: true
      - attribute: pvcName
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONSUMES
      source:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: KUBERNETES_POD
          identifier:
            fragments:
              - value: "k8s:"
              - attribute: clusterName
              - value: ":"
              - attribute: namespaceName
              - value: ":pod:"
              - attribute: podName
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: KUBERNETES_PERSISTENTVOLUMECLAIM
  - name: otelKsmK8sPodConsumesPersistentVolumeClaim
    # kube-state-metrics kube_pod_spec_volumes_persistentvolumeclaims_info: one
    # row per pod per PVC volume. It is pod-centric, so its entity.guid is the
    # Pod and the PVC GUID is built from the cluster/namespace/pvc identifier.
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: metricName
        anyOf: [ "kube_pod_spec_volumes_persistentvolumeclaims_info" ]
      - attribute: k8s.pvc.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.cluster.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONSUMES
      source:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KUBERNETES_POD
      target:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: KUBERNETES_PERSISTENTVOLUMECLAIM
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pvc.name
            hashAlgorithm: FARM_HASH
