relationships:
  # NR-agent (nri-kubernetes) path. K8sVolumeSample carries podName + pvcName, but its entityGuid is the
  # volume's own guid -- NOT the Pod's or PVC's -- so neither side can be extracted. Both GUIDs are built from
  # the datapoint instead. A buildGuid side cannot be combined with a lookupGuid side (not supported by
  # synthesis), so no lookups are used and the account is pinned to the datapoint's accountId on both sides.
  # nri entities have legacy INFRA|NA|... guids (overrideGuidType) whose hash is FARM_HASH of the entityName:
  #   Pod: k8s:<cluster>:<namespace>:pod:<podName>
  #   PVC: k8s:<cluster>:<namespace>:PersistentVolumeClaim:<pvcName>
  - name: K8sPodConsumesPersistentVolumeClaim
    version: "1"
    origins:
      - Kubernetes Integration
    conditions:
      - attribute: eventType
        anyOf: [ "K8sVolumeSample" ]
      - attribute: clusterName
        present: true
      - attribute: namespaceName
        present: true
      - attribute: podName
        present: true
      - attribute: pvcName
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONSUMES
      source:
        buildGuid:
          account:
            # Pinned to the datapoint account: a lookup searches the whole trusted account and is discarded
            # when the GUID exists in 2+ accounts (mirrored telemetry).
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: KUBERNETES_POD
            # nri-kubernetes Pods have legacy INFRA|NA|... guids (overrideGuidType), so build with NA.
            valueInGuid: NA
          identifier:
            fragments:
              - value: "k8s:"
              - attribute: clusterName
              - value: ":"
              - attribute: namespaceName
              - value: ":pod:"
              - attribute: podName
            hashAlgorithm: FARM_HASH
      target:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: KUBERNETES_PERSISTENTVOLUMECLAIM
            valueInGuid: NA
          identifier:
            fragments:
              - value: "k8s:"
              - attribute: clusterName
              - value: ":"
              - attribute: namespaceName
              - value: ":PersistentVolumeClaim:"
              - attribute: pvcName
            hashAlgorithm: FARM_HASH
  - name: otelKsmK8sPodConsumesPersistentVolumeClaim
    # kube-state-metrics kube_pod_spec_volumes_persistentvolumeclaims_info: one
    # row per pod per PVC volume. It is pod-centric, so its entity.guid is the
    # Pod and the PVC GUID is built from the cluster/namespace/pvc identifier.
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: metricName
        anyOf: [ "kube_pod_spec_volumes_persistentvolumeclaims_info" ]
      - attribute: k8s.pvc.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.cluster.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: CONSUMES
      source:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KUBERNETES_POD
      target:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: KUBERNETES_PERSISTENTVOLUMECLAIM
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pvc.name
            hashAlgorithm: FARM_HASH
