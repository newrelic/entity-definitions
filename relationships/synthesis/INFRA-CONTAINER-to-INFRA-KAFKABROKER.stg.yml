relationships:
  # Rule 1: NR OnHost Integration K8s container IS Kafka broker (KafkaBrokerSample)
  # Resolves the container via the existing CONTAINER candidate (already matched on
  # k8sClusterName/k8sNamespaceName/k8sPodName/k8sContainerName and already consumed by other
  # relationships, so this is a new consumer of an already-computed index, not a new one) rather
  # than rebuilding its GUID assuming the same accountId as the broker event - that assumption
  # breaks whenever the container entity lives in a different account than the broker.
  - name: ContainerContainsKafkaBrokerStg
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["KafkaBrokerSample"]
      - attribute: entityType
        anyOf: ["KafkaBroker", "KAFKABROKER"]
      - attribute: clusterName
        present: true
      - attribute: namespace
        present: true
      - attribute: podName
        present: true
      - attribute: name
        present: true
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        lookupGuid:
          candidateCategory: CONTAINER
          fields:
            - field: k8sClusterName
              attribute: clusterName
            - field: k8sNamespaceName
              attribute: namespace
            - field: k8sPodName
              attribute: podName
            - field: k8sContainerName
              attribute: name
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: KAFKABROKER

  # Rule 2: OTel Kafka broker (plain Docker) → OTel Container (dockerstats receiver)
  - name: OtelKafkaBrokerToOtelDockerContainerStg
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric", "Log"]
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: entity.type
        anyOf: ["KAFKABROKER"]
      - attribute: container.id
        present: true
      - attribute: k8s.pod.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: IS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: CONTAINER
          identifier:
            fragments:
              - attribute: container.id
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            attribute: entity.type

  # Rule 3: OTel Kafka broker (plain Docker) → NR native Container (ContainerSample)
  - name: OtelKafkaBrokerToNrDockerContainerStg
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric", "Log"]
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: entity.type
        anyOf: ["KAFKABROKER"]
      - attribute: container.id
        present: true
      - attribute: k8s.pod.name
        present: false
    relationship:
      expires: PT75M
      relationshipType: IS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: CONTAINER
            valueInGuid: NA
          identifier:
            fragments:
              - value: "docker:"
              - attribute: container.id
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            attribute: entity.type

  # Rule 4: OTel Kafka broker (K8s) → OTel K8s Container (kube-state-metrics / cAdvisor / kubeletstats)
  - name: OtelKafkaBrokerToOtelK8sContainerStg
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric", "Log"]
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: entity.type
        anyOf: ["KAFKABROKER"]
      - attribute: k8s.cluster.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.pod.name
        present: true
      - attribute: k8s.container.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: IS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: CONTAINER
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pod.name
              - value: ":"
              - attribute: k8s.container.name
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            attribute: entity.type

  # Rule 5: OTel Kafka broker (K8s) → NR native K8s Container (K8sContainerSample)
  - name: OtelKafkaBrokerToNrK8sContainerStg
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric", "Log"]
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      - attribute: entity.type
        anyOf: ["KAFKABROKER"]
      - attribute: k8s.cluster.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.pod.name
        present: true
      - attribute: k8s.container.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: IS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: CONTAINER
            valueInGuid: NA
          identifier:
            fragments:
              - value: "k8s:"
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pod.name
              - value: ":container:"
              - attribute: k8s.container.name
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            attribute: entity.type
