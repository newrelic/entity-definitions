relationships:
  # OpenTelemetry scenario: RabbitMQ node monitored via the OTel rabbitmqreceiver.
  # The host running the collector reports host.id as a resource attribute; we resolve
  # it to the INFRA-HOST via the HOST candidate (host.id -> hostId) and attach it to the
  # RABBITMQNODE entity synthesized from the same rabbitmqreceiver metrics.
  - name: hostHostsRabbitMQNodeOtel
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: ["Metric"]
      # All metrics from the receiver start with the 'rabbitmq.' prefix.
      - attribute: metricName
        startsWith: rabbitmq.
      - attribute: instrumentation.provider
        anyOf: ["opentelemetry"]
      # Only match metrics coming from the rabbitmq receiver.
      - attribute: otel.library.name
        anyOf: ["github.com/open-telemetry/opentelemetry-collector-contrib/receiver/rabbitmqreceiver"]
      - attribute: host.id
        present: true
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        lookupGuid:
          candidateCategory: HOST
          fields:
            - field: hostId
              attribute: host.id
      target:
        extractGuid:
          attribute: entity.guid

  # Local scenario: RabbitMQ node running on the same host
  - name: hostHostsRabbitMQNode
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["RabbitmqNodeSample"]
      - attribute: entityType
        anyOf: ["RABBITMQNODE"]
      - attribute: hostname
        present: true
      # Local detection - broker address is localhost
      - attribute: displayName
        regex: "^(localhost|127\\.0\\.0\\.1|::1|0\\.0\\.0\\.0)(:.*)$"
      - attribute: podName # condition to exclude k8s hosts
        present: false
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: reportingAgent
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: RABBITMQNODE
  # Remote scenario: Host monitors remote RabbitMQ node
  - name: hostMonitorsRabbitMQNode
    version: "1"
    origins:
      - OnHost Integration
    conditions:
      - attribute: eventType
        anyOf: ["RabbitmqNodeSample"]
      - attribute: entityType
        anyOf: ["RABBITMQNODE"]
      - attribute: hostname
        present: true
      - attribute: displayName
        regex: "^(?!localhost|127\\.0\\.0\\.1|::1|0\\.0\\.0\\.0).*"
      - attribute: podName # condition to exclude k8s hosts
        present: false
    relationship:
      expires: PT75M
      relationshipType: MEASURES
      source:
        buildGuid:
          account:
            attribute: accountId
          domain:
            value: INFRA
          type:
            value: HOST
            valueInGuid: NA
          identifier:
            fragments:
              - attribute: reportingAgent
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: RABBITMQNODE

    # Local scenario: RabbitMQ node running on the same host
  - name: hostHostsRabbitMQNodeRule2
