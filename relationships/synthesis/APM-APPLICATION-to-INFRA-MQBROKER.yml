relationships:
  - name: apmProducesAwsMqBroker
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: name
        regex: "MessageBroker/[^/]*/[^/]*/Produce/Named/[^/]*"
      - attribute: server.address
        regex: '.*\.(amazonaws\.com|on\.aws)$'
    relationship:
      expires: PT75M
      relationshipType: PRODUCES
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSMQBROKER
          fields:
            - field: endpoint
              attribute: server.address         

  - name: apmConsumesAwsMqBroker
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: name
        regex: "MessageBroker/[^/]*/[^/]*/Consume/Named/[^/]*"
      - attribute: server.address
        regex: '.*\.(amazonaws\.com|on\.aws)$'
    relationship:
      expires: PT75M
      relationshipType: CONSUMES
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSMQBROKER
          fields:
            - field: endpoint
              attribute: server.address

  - name: apmCallsAwsMqBroker
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: [ "Span" ]
      - attribute: name
        regex: "OtherTransaction/Message/[^/]*/[^/]*"
      - attribute: server.address
        regex: '.*\.(amazonaws\.com|on\.aws)$'
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSMQBROKER
          fields:
            - field: endpoint
              attribute: server.address