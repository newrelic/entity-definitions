relationships:
  - name: apmApplicationCallsInfraOracleDbInstanceByHost
    version: "1"
    origins:
      - APM Metrics
    conditions:
      - attribute: metricName
        regex: "^[Dd]atastore/instance/Oracle/[^/]+/[0-9]+"
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: ORACLEDBINSTANCE
          fields:
            - field: serverAddress
              attribute: metricName__4
            - field: serverPort
              attribute: metricName__5

  # Distributed Tracing rule for NR native APM agents (Java + .NET).
  # NR native agents emit server.address on DB spans.
  - name: apmApplicationCallsOracleDbInstanceByHostStaging
    version: "1"
    origins:
      - Distributed Tracing
    conditions:
      - attribute: eventType
        anyOf: ["Span"]
      - attribute: db.system
        anyOf: ["oracle", "Oracle"]
      - attribute: server.address
        present: true
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: ORACLEDBINSTANCE
          fields:
            - field: serverAddress
              attribute: server.address