relationships:
  - name: apmApplicationCallsInfraOracleDbInstanceByHost
    version: "1"
    origins:
      - APM Metrics
    conditions:
      # Matches both numeric ports and the literal "default" (emitted by APM
      # when the client didn't specify a port or hit the default instance).
      - attribute: metricName
        regex: "^[Dd]atastore/instance/Oracle/[^/;]*/.*"
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: ORACLEDBINSTANCE
          fields:
            - field: serverAddress
              attribute: metricName__4
            - field: serverPort
              attribute: metricName__5
            - field: endpointWithPort
              capture:
                attribute: metricName
                regex: '^[Dd]atastore/instance/Oracle/([^/;]*/.*)'