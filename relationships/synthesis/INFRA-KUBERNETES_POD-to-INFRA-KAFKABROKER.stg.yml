relationships:
    # Relationship for OTEL Kafka broker metrics in K8s pods
  - name: k8sPodHostsKafkaBrokerStg1
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Metric" ]
      - attribute: metricName
        startsWith: kafka
      - attribute: instrumentation.provider
        anyOf: [ "opentelemetry" ]
      - attribute: k8s.cluster.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.pod.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: KUBERNETES_POD
          identifier:
            fragments:
              - attribute: k8s.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pod.name
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KAFKABROKER

  # Experimental relationship for OTEL Kafka broker metrics in K8s pods (alternative to above)
  - name: k8sPodHostsKafkaBrokerStg2
    version: "1"
    origins:
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Metric" ]
      - attribute: metricName
        startsWith: kafka
      - attribute: instrumentation.provider
        anyOf: [ "opentelemetry" ]
      - attribute: kafka.cluster.name
        present: true
      - attribute: k8s.namespace.name
        present: true
      - attribute: k8s.pod.name
        present: true
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        buildGuid:
          account:
            lookup: true
          domain:
            value: INFRA
          type:
            value: KUBERNETES_POD
          identifier:
            fragments:
              - attribute: kafka.cluster.name
              - value: ":"
              - attribute: k8s.namespace.name
              - value: ":"
              - attribute: k8s.pod.name
            hashAlgorithm: FARM_HASH
      target:
        extractGuid:
          attribute: entity.guid
          entityType:
            value: KAFKABROKER

  # Triggers from the pod's own native telemetry instead of the broker's, so it works
  # cross-account (broker and pod can report to different accounts - confirmed with real data).
  - name: k8sPodHostsKafkaBrokerCandidateStg
    version: "1"
    origins:
      - Kubernetes Integration
    conditions:
      - attribute: eventType
        anyOf: [ "K8sPodSample" ]
      - attribute: namespaceName
        present: true
      - attribute: podName
        present: true
    relationship:
      expires: PT75M
      relationshipType: HOSTS
      source:
        extractGuid:
          attribute: entityGuid
          entityType:
            value: KUBERNETES_POD
      target:
        lookupGuid:
          candidateCategory: KAFKABROKER
          fields:
            - field: k8sNamespaceName
              attribute: namespaceName
            - field: k8sPodName
              attribute: podName
