# qmid is the only globally unique queue manager identifier; names collide across hosts. The
# entity GUID hashes host.id:qmgr, which a span cannot know, so a tag lookup is the only route.
category: IBMMQ_MANAGER
lookups:
  - entityTypes:
      - INFRA-IBMMQ_MANAGER
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.qmid"]
          field: queueManagerId
        - attributeKeys: ["tags.instrumentation.provider"]
          field: instrumentationProvider
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
