category: ORACLEDBINSTANCE
lookups:
  - entityTypes:
    - INFRA-ORACLEDBINSTANCE
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["server.address"]
          field: serverAddress
        - tagKeys: ["server.port"]
          field: serverPort
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
  
  # DistributedTracingServerAddress lookup: matches DB spans by server.address.
  - entityTypes:
      - INFRA-ORACLEDBINSTANCE
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["server.address"]
          field: DistributedTracingServerAddress
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: ORACLEDBINSTANCE