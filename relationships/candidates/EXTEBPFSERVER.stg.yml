category: EXTEBPFSERVER
lookups:
  - entityTypes:
      - EXT-SERVICE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.local_endpoint"]
          field: local_endpoint
        - attributeKeys: ["tags.host.name"]
          field: hostname
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: EBPFSERVER
