category: NETWORK_DEVICE
lookups:
  - entityTypes:
      - EXT-SWITCH
      - EXT-ROUTER
      - EXT-ACCESS_POINT
      - EXT-NETWORK_DEVICE
    tags:
      matchingMode: FIRST
      predicates:
        - tagKeys: ["mac", "stackMemberMac"]
          field: mac
        - tagKeys: ["ipAddress", "managementIp", "device_ip"]
          field: managementIp
        - tagKeys: ["normalizedName"]
          field: normalizedName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
