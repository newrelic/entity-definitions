category: NETWORK_DEVICE
lookups:
  - entityTypes:
      - EXT-SWITCH
      - EXT-ROUTER
      - EXT-ACCESS_POINT
      - EXT-NETWORK_DEVICE
    attributes:
      matchingMode: FIRST
      predicates:
        - attributeKeys: ["tags.identifier"]
          field: identifier
        - attributeKeys: ["tags.mac"]
          field: mac
        - attributeKeys: ["tags.ipAddress", "tags.managementIp", "tags.device_ip"]
          field: managementIp
        - attributeKeys: ["tags.normalizedName"]
          field: normalizedName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
