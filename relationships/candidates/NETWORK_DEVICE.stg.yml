# NETWORK_DEVICE candidate — EXT-only topology resolver.
# Design: docs/superpowers/specs/2026-07-08-network-topology-ext-only.md
#
# Tag-based priority resolver (mac -> managementIp -> hostname, matchingMode FIRST), resolving a
# neighbour to one of the three EXT topology node types. Returns the EXT entity's GUID (built on
# device_name), so it converges with the EXT source build. The `hostname` tag on those entities is the
# device_name (optionally normalized by the job), matched against the observed dstName.
category: NETWORK_DEVICE
lookups:
  - entityTypes:
      - domain: EXT
        type: SWITCH
      - domain: EXT
        type: ROUTER
      - domain: EXT
        type: ACCESS_POINT
    tags:
      matchingMode: FIRST
      predicates:
        - tagKeys: ["mac", "stackMemberMac"]
          field: mac
        - tagKeys: ["ipAddress", "managementIp", "device_ip"]
          field: managementIp
        - tagKeys: ["hostname", "host.name"]
          field: hostname
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
