category: MSSQLINSTANCE
lookups:
  - entityTypes:
      - INFRA-MSSQLINSTANCE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.server.address"]
          field: serverAddress
        - attributeKeys: ["tags.server.port"]
          field: serverPort
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
  - entityTypes:
      - INFRA-MSSQLINSTANCE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.host.name"]
          field: hostName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
