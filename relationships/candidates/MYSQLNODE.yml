category: MYSQLNODE
lookups:
  # Index OTel-synthesized MYSQLNODE entities by server.address + server.port so that
  # applications can look them up and form a CALLS relationship. Consumed by both
  # APM-APPLICATION-to-INFRA-MYSQLNODE.yml (native-APM datastore timeslice metrics)
  # and OTEL-APPLICATION-to-INFRA-MYSQLNODE.yml (OTLP distributed-tracing spans).
  # Requires the server.address / server.port tags added to the MYSQLNODE OTel
  # synthesis rule in definition.yml.
  - entityTypes:
      - INFRA-MYSQLNODE
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["server.address"]
          field: serverAddress
        - tagKeys: ["server.port"]
          field: serverPort
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
