category: HOST
lookups:
  - entityTypes:
    - INFRA-HOST
    attributes:
      matchingMode: ANY
      predicates:
        - attributeKeys: ["tags.host.id", "tags.aws.ec2.host.id"]
          field: cloudProviderId
        - attributeKeys: ["tags.host.id", "tags.aws.ec2.host.id"]
          field: host.id
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: HOST

  - entityTypes:
    - INFRA-HOST
    attributes:
      matchingMode: FIRST
      predicates:
        - attributeKeys: ["tags.displayname"]
          field: displayName
        - attributeKeys: ["tags.fullhostname"]
          field: hostName
        - attributeKeys: ["tags.hostname"]
          field: hostName
        - attributeKeys: ["tags.host.name"]
          field: hostName
        - attributeKeys: ["tags.host.name"]
          field: displayName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: HOST

  - entityTypes:
    - INFRA-HOST
    attributes:
      matchingMode: ANY
      predicates:
        - attributeKeys: ["tags.hostname"]
          field: onHostEntityHostname
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: HOST
  - entityTypes:
    - INFRA-HOST
    attributes:
      matchingMode: ANY
      predicates:
        - attributeKeys: ["tags.host.id"]
          field: hostId
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: HOST
