category: MSSQLINSTANCE
lookups:
  - entityTypes:
      - INFRA-MSSQLINSTANCE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.server.address"]
          field: serverAddress
        - attributeKeys: ["tags.server.port"]
          field: serverPort
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: DATABASE
  # host.name-only, no address/port disambiguation. Dormant until infra-mssqlinstance's
  # host.name tag ships (see definition.stg.yml); DISCARD_ALL (not RELATE_ALL) because a host
  # running multiple named MSSQL instances would otherwise fan out CALLS to all of them. Must
  # be promoted to MSSQLDBINSTANCE.yml together with the host.name tag change.
  - entityTypes:
      - INFRA-MSSQLINSTANCE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.host.name"]
          field: hostName
    onMatch:
      onMultipleMatches: DISCARD_ALL
    onMiss:
      action: NO_OP
