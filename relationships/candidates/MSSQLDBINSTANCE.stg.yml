category: MSSQLINSTANCE
lookups:
  - entityTypes:
      - INFRA-MSSQLINSTANCE
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["server.address"]
          field: serverAddress
        - tagKeys: ["server.port"]
          field: serverPort
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: DATABASE
  - entityTypes:
      - INFRA-MSSQLINSTANCE
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["host.name"]
          field: hostName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
