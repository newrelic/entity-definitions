category: NGINXSERVER
lookups:
  # Path A — deployment-name lookup
  - entityTypes:
      - INFRA-NGINXSERVER
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.nginx.deployment.name"]
          field: deploymentName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

  # Path B — address-only lookup
  - entityTypes:
      - INFRA-NGINXSERVER
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.nginx.server.address"]
          field: serverAddress
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
