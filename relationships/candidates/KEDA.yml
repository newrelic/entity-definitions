category: KEDA
lookups:
  - entityTypes:
      - EXT-KEDA
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.k8s.clusterName"]
          field: k8s.clusterName
        - attributeKeys: ["tags.k8s.namespaceName"]
          field: k8s.namespaceName
