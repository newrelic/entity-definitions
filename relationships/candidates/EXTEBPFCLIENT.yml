category: EXTEBPFCLIENT
lookups:
  - entityTypes:
      - EXT-SERVICE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.local_addr"]
          field: ip
        - attributeKeys: ["tags.host.name"]
          field: hostname
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: EBPFCLIENT
