          field: accountName
        - attributeKeys: ["tags.azure.name"]
          field: databaseName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: DATABASE