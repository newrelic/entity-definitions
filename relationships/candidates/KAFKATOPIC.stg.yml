category: KAFKATOPIC
lookups:
  - entityTypes:
      - INFRA-AWSMSKTOPIC
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.aws.clusterName", "tags.aws.kafka.ClusterName"]
          field: clusterName
        - attributeKeys: ["tags.aws.awsRegion", "tags.aws.region"]
          field: region
        - attributeKeys: ["tags.aws.topic", "tags.aws.kafka.Topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # bootstrapServers match (public/Basic/Standard clusters).
  - entityTypes:
      - INFRA-CONFLUENTCLOUDKAFKATOPIC
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.confluent.clusterBootstrapServers", "tags.bootstrap.servers"]
          field: bootstrapServers
        - attributeKeys: ["tags.confluent.kafka.server.metric.topic", "tags.topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # clusterId match, for private-networked (PrivateLink/PSC) clusters.
  - entityTypes:
      - INFRA-CONFLUENTCLOUDKAFKATOPIC
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.confluent.clusterId"]
          field: clusterId
        - attributeKeys: ["tags.confluent.kafka.server.metric.topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  - entityTypes:
      - INFRA-KAFKATOPIC
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.clusterName"]
          field: clusterName
        - attributeKeys: ["tags.topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # Native (nri-kafka) clusterId match - its own tag name, not the OTel kafka.cluster.id below.
  - entityTypes:
      - INFRA-KAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["clusterId"]
          field: clusterId
        - tagKeys: ["topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # Match KAFKATOPIC by producer.service.name tag — for consumers that don't carry kafka.cluster.name.
  - entityTypes:
      - INFRA-KAFKATOPIC
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.producer.service.name"]
          field: producerServiceName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

  # Match KAFKATOPIC by kafka.cluster.id tag — for self-hosted clusters emitting cluster UUID.
  - entityTypes:
      - INFRA-KAFKATOPIC
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.kafka.cluster.id"]
          field: clusterId
        - attributeKeys: ["tags.topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

