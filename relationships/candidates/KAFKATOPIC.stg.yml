category: KAFKATOPIC
lookups:
  - entityTypes:
      - INFRA-AWSMSKTOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: [ "aws.clusterName", "aws.kafka.ClusterName" ]
          field: clusterName
        - tagKeys: [ "aws.awsRegion", "aws.region" ]
          field: region
        - tagKeys: [ "aws.topic", "aws.kafka.Topic" ]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # bootstrapServers match (public/Basic/Standard clusters). Synthesis now emits this as its
  # own candidate carrying only bootstrapServers+topic (never clusterId), so this tier is
  # terminal in practice: the clusterId tier below is structurally skipped for it (missing
  # field), never reached as a fallback. onMiss must create the uninstrumented placeholder
  # here directly, matching production's unmodified single-tier behavior.
  - entityTypes:
      - INFRA-CONFLUENTCLOUDKAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: [ "confluent.clusterBootstrapServers", "bootstrap.servers" ]
          field: bootstrapServers
        - tagKeys: [ "confluent.kafka.server.metric.topic", "topic" ]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # clusterId match, for private-networked (PrivateLink/PSC) clusters — synthesized as its own
  # candidate carrying only clusterId+topic (never bootstrapServers), so this tier never
  # overlaps with the one above.
  - entityTypes:
      - INFRA-CONFLUENTCLOUDKAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: [ "confluent.clusterId" ]
          field: clusterId
        - tagKeys: [ "confluent.kafka.server.metric.topic", "topic" ]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  - entityTypes:
      - INFRA-KAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["clusterName"]
          field: clusterName
        - tagKeys: ["topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # Match KAFKATOPIC by producer.service.name tag — for consumers that don't carry kafka.cluster.name.
  - entityTypes:
      - INFRA-KAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["producer.service.name"]
          field: producerServiceName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

  # Match KAFKATOPIC by kafka.cluster.id tag — for self-hosted clusters emitting cluster UUID.
  - entityTypes:
      - INFRA-KAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["kafka.cluster.id"]
          field: clusterId
        - tagKeys: ["topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

