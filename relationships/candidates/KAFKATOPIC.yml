category: KAFKATOPIC
lookups:
  - entityTypes:
    - INFRA-AWSMSKTOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["aws.clusterName", "aws.kafka.ClusterName"]
          field: clusterName
        - tagKeys: ["aws.awsRegion", "aws.region"]
          field: region
        - tagKeys: ["aws.topic", "aws.kafka.Topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC
  
  # bootstrapServers match (public/Basic/Standard clusters).
  - entityTypes:
    - INFRA-CONFLUENTCLOUDKAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["confluent.clusterBootstrapServers", "bootstrap.servers"]
          field: bootstrapServers
        - tagKeys: ["confluent.kafka.server.metric.topic", "topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC

  # clusterId match, for private-networked (PrivateLink/PSC) clusters.
  - entityTypes:
    - INFRA-CONFLUENTCLOUDKAFKATOPIC
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["confluent.clusterId"]
          field: clusterId
        - tagKeys: ["confluent.kafka.server.metric.topic", "topic"]
          field: topic
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: KAFKATOPIC