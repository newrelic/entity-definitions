# NETWORK_PORT candidate — EXT-only, resolves far ports to EXT/PORT.
# Design: docs/superpowers/specs/2026-07-08-network-topology-ext-only.md
#
# Resolves a far port by the owning device's identity tier + port name, in priority order:
# (deviceMac + port) -> (deviceManagementIp + port) -> (deviceHostname + port). Each tier ALL.
# deviceHostname (= the owning device's device_name) is the reliable tier; deviceMac is best-effort.
category: NETWORK_PORT
lookups:
  - entityTypes:
      - domain: EXT
        type: PORT
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["deviceMac"]
          field: deviceMac
        - tagKeys: ["port"]
          field: port
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

  - entityTypes:
      - domain: EXT
        type: PORT
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["deviceManagementIp"]
          field: deviceManagementIp
        - tagKeys: ["port"]
          field: port
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP

  - entityTypes:
      - domain: EXT
        type: PORT
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["deviceHostname"]
          field: deviceHostname
        - tagKeys: ["port"]
          field: port
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
