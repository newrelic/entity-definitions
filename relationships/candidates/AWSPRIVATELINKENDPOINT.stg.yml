category: AWSPRIVATELINKENDPOINT
# STAGING ONLY. NR-590130 — generic VPC (interface) endpoint matching.
#
# Covers BOTH cases with one mechanism, because both are the SAME consumer-side interface
# endpoint entity (AWSPRIVATELINKENDPOINT):
#   - AWS managed services reached via an interface VPC endpoint with private DNS OFF, and
#   - customer "VPC Service" (PrivateLink endpoint services) reached via an interface endpoint.
# In both, when private DNS is OFF the NR Java agent emits the endpoint-specific DNS name
#   vpce-<id>-<hash>[.<az>].<svc>.<region>.vpce.amazonaws.com
# as server.address (Span) / the External/<host>/all host (timeslice). The match is
# byte-for-byte host-only against a DNS-name tag on the entity.
#
# DEPENDENCY (link 4): the AWSPRIVATELINKENDPOINT entity carries NO endpoint/DNS tag today
# (beyond-common's AWS/PrivateLinkEndpoints block has no configuration_attributes, and there
# is no ACF mapping yet). This candidate is inert until ACF publishes aws.vpce.dnsName from
# Cloud Control AWS::EC2::VPCEndpoint (companion ACF change). NOTE the Cloud Control shape:
# Properties.DnsEntries is an array of STRINGS "<hostedZoneId>:<dnsName>" (NOT objects with a
# .DnsName field, unlike the describe-vpc-endpoints API). Index [0] is the regional name the
# agent dials; the ACF reader takes DnsEntries[0] and strips the "<zoneId>:" prefix to host-only.
# `endpoint` is included so a friendly/Route53 value relates too once auto-discovery attaches it.
#
# VERIFIED 2026-07-31 on the vpce-test-infra rig (NR staging APM acct 686923): with private DNS
# OFF the Java agent emitted server.address AND External/<host>/all for both the AWS-managed
# (SQS: vpce-02bd70f9f1fc6a5db-cgzx6yrw.sqs.eu-north-1.vpce.amazonaws.com) and the customer
# VPC-Service (vpce-0811dfc190fb9ab36-rrpctp1o.vpce-svc-0ddd4cfe0cd919f50.eu-north-1.vpce.amazonaws.com)
# cases, both matching the synthesis regex. Cloud Control DnsEntries[0] carried the identical host.
#
# NOT covered (by design): private DNS ON to an AWS managed service — the agent emits the
# service's own host and correctly relates to the SERVICE entity (the VPCE is transparent).
# A customer VPC service behind a Route53 private hosted zone (custom domain) is the same
# friendly-name case deferred with MQ/Redis: it needs the custom domain attached as a tag.
lookups:
  - entityTypes:
      - domain: INFRA
        type: AWSPRIVATELINKENDPOINT
    tags:
      matchingMode: ANY
      predicates:
        - tagKeys: ["endpoint", "aws.vpce.dnsName"]
          field: serverAddress
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      # Safe to stamp a typed stub: the synthesis rule is gated to *.vpce.amazonaws.com hosts,
      # which are unambiguously AWS interface-endpoint DNS names.
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: AWSPRIVATELINKENDPOINT
