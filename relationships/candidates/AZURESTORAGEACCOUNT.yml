category: AZURESTORAGEACCOUNT
lookups:
  - entityTypes:
      - INFRA-AZURESTORAGEACCOUNT
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.azure.resourceId"]
          field: azureResourceId
        - attributeKeys: ["tags.collector.name"]
          field: collectorName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: AZURESTORAGEACCOUNT
  # Storage account in another subscription, matched by the account name in its endpoint host name (ACF sends
  # the name as field resourceName). Storage account names are globally unique. A miss creates nothing.
  - entityTypes:
      - INFRA-AZURESTORAGEACCOUNT
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.azure.resourceName"]
          field: resourceName
        - attributeKeys: ["tags.collector.name"]
          field: collectorName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
