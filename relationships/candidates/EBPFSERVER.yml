category: EBPFSERVER
lookups:
  - entityTypes:
    - EBPF-REDIS_SERVER
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.ip"]
          field: ip
        - attributeKeys: ["tags.port"]
          field: port
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: EBPFSERVER