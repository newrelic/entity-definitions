category: EBPFSERVER
lookups:
  - entityTypes:
    - EBPF-REDIS_SERVER
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["ip"]
          field: ip
        - tagKeys: ["port"]
          field: port
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: EBPFSERVER