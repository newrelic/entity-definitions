category: AWSS3BUCKET
lookups:
  - entityTypes:
    - INFRA-AWSS3BUCKET
    tags:
      matchingMode: ANY
      predicates:
        - tagKeys: ["aws.bucketName", "aws.s3.BucketName"]
          field: bucketName
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: AWSS3BUCKET

  - entityTypes:
    - INFRA-AWSS3BUCKET
    tags:
      matchingMode: ANY
      predicates:
        - tagKeys: ["aws.Arn"]
          field: awsS3arn
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: AWSS3BUCKET