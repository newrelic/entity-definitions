category: REDIS
lookups:
  - entityTypes:
      - INFRA-AWSELASTICACHEREDISCLUSTER
      - INFRA-AWSELASTICACHEREDISNODE
      - INFRA-AWSELASTICACHEREDISREPLICATIONGROUP
      - INFRA-AWSELASTICACHEREDISSHARD
      - INFRA-AWSELASTICACHEREDISSERVERLESS
      - INFRA-AWSELASTICACHEVALKEYCLUSTER
      - INFRA-AWSELASTICACHEVALKEYNODE
      - INFRA-AWSELASTICACHEVALKEYSERVERLESS
      - INFRA-GCPMEMORYSTOREINSTANCE
    attributes:
      matchingMode: ANY
      predicates:
        - attributeKeys: ["tags.endpoint", "tags.aws.elasticache.endpointAddress", "tags.aws.elasticache.configurationEndpointAddress", "tags.aws.elasticache.primaryEndpointAddress", "tags.aws.elasticache.readerEndpointAddress", "tags.gcp.endpoint"]
          field: endpoint
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: REDIS
  # STAGING: dedicated lookup for self-hosted / OTel Redis (INFRA-REDISINSTANCE),
  # mirroring MYSQLNODE: match the real entity by server.address + server.port so the
  # APM->Redis lookup resolves it instead of creating an UNINSTRUMENTED-REDIS stub.
  - entityTypes:
      - INFRA-REDISINSTANCE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.server.address"]
          field: endpoint
        - attributeKeys: ["tags.server.port"]
          field: port
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
