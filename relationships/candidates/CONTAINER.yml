category: CONTAINER
lookups:
  - entityTypes:
    - INFRA-CONTAINER
    attributes:
      matchingMode: ANY
      predicates:
        - attributeKeys: ["tags.k8s.containerId", "tags.docker.containerId", "tags.docker.shortContainerId", "tags.container.id"]
          field: containerId
    onMatch:
     onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: CONTAINER
  - entityTypes:
      - INFRA-CONTAINER
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.k8s.clusterName"]
          field: k8sClusterName
        - attributeKeys: ["tags.k8s.namespaceName"]
          field: k8sNamespaceName
        - attributeKeys: ["tags.k8s.podName"]
          field: k8sPodName
        - attributeKeys: ["tags.k8s.containerName"]
          field: k8sContainerName
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: CONTAINER
