category: AZURESQLDATABASE
lookups:
  - entityTypes:
      - INFRA-AZURESQLDATABASE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.azure.provider.sqlServerName"]
          field: endpoint
        - attributeKeys: ["tags.azure.name"]
          field: dbname
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: NO_OP
  - entityTypes:
      - INFRA-AZURESQLDATABASE
    attributes:
      matchingMode: ALL
      predicates:
        - attributeKeys: ["tags.azure.failoverGroupName"]
          field: endpoint
        - attributeKeys: ["tags.azure.name"]
          field: dbname
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: DATABASE