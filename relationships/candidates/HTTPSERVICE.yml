    - APM-APPLICATION
    - EXT-SERVICE
    attributes:
      matchingMode: ANY
      predicates:
        - attributeKeys: ["tags.nr.endpoint", "tags.endpoint"]
          field: hostname
    onMatch:
     onMultipleMatches: DISCARD_ALL
