category: AWSREDSHIFTCLUSTER
# NR-590130 (staging): stage the prod AWSREDSHIFTCLUSTER candidate with the polling bare
# host key added. The prod synthesis rule (APM-APPLICATION-to-INFRA-REDSHIFTCLUSTER.yml)
# extracts the emitted host (server.address / peer.hostname) into `serverAddress` and looks
# it up here. Prod matches only aws.redshift.serverAddress (metric-streams) / aws.Arn; polling
# emits aws.serverAddress (beyond-backend ClusterState.getMetadata providerPut("serverAddress"),
# bare `aws.` prefix, no service infix). Adding it to the same predicate's tagKeys (OR within a
# tagKeys list) lets a polling-sourced entity match on the identical host value the agent emits.
lookups:
  - entityTypes:
      - domain: INFRA
        type: AWSREDSHIFTCLUSTER
    tags:
      matchingMode: ALL
      predicates:
        - tagKeys: ["aws.redshift.serverAddress", "aws.serverAddress", "aws.Arn"]
          field: serverAddress
    onMatch:
      onMultipleMatches: RELATE_ALL
    onMiss:
      action: CREATE_UNINSTRUMENTED
      uninstrumented:
        type: AWSREDSHIFTCLUSTER
