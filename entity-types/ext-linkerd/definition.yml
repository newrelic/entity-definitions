domain: EXT
type: LINKERD
goldenTags:
  - k8s.clusterName
  - k8s.namespaceName

synthesis:
  rules:
  - ruleName: ext_linkerd_hostname
    identifier: hostname
    name: hostname
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: linkerd
      - attribute: metricName
        value: "inbound_http_authz_allow_total"
    tags:
      ip:
      newrelic.agentVersion:

  # OTel metrics — ONE entity per Linkerd control plane (per cluster).
  # Identifier is cluster + control-plane namespace only; k8s.deployment.name is intentionally
  # absent so linkerd-destination, linkerd-identity, and linkerd-proxy-injector all collapse
  # into the same entity.
  # Gated on linkerd_control_plane_component (not the install namespace name) so this works
  # regardless of what namespace Linkerd was installed into.
  - ruleName: ext_linkerd_otel
    compositeIdentifier:
      separator: ":"
      attributes:
        - k8s.cluster.name
        - linkerd_control_plane_ns
    encodeIdentifierInGUID: true
    compositeName:
      fragments:
        - attribute: k8s.cluster.name
        - value: "-"
        - attribute: linkerd_control_plane_ns
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: k8s.cluster.name
        present: true
      - attribute: linkerd_control_plane_ns
        present: true
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
      - attribute: service.name
        present: false

  # OTel logs — same composite identifier as the metric rule so logs from all control plane
  # components (destination, identity, proxy-injector) attach to the same single entity.
  - ruleName: ext_linkerd_otel_logs
    compositeIdentifier:
      separator: ":"
      attributes:
        - k8s.cluster.name
        - linkerd_control_plane_ns
    encodeIdentifierInGUID: true
    compositeName:
      fragments:
        - attribute: k8s.cluster.name
        - value: "-"
        - attribute: linkerd_control_plane_ns
    conditions:
      - attribute: eventType
        value: Log
      - attribute: k8s.cluster.name
        present: true
      - attribute: linkerd_control_plane_ns
        present: true
      - attribute: linkerd_control_plane_component
        present: true
      - attribute: instrumentation.provider
        value: opentelemetry

  # OTel spans — same composite identifier as the metric/log rules so spans from all control
  # plane components (destination, identity, proxy-injector) attach to the same single entity.
  # linkerd_control_plane_component: present: true scopes this to control-plane pods only.
  - ruleName: ext_linkerd_otel_span
    compositeIdentifier:
      separator: ":"
      attributes:
        - k8s.cluster.name
        - linkerd_control_plane_ns
    encodeIdentifierInGUID: true
    compositeName:
      fragments:
        - attribute: k8s.cluster.name
        - value: "-"
        - attribute: linkerd_control_plane_ns
    conditions:
      - attribute: eventType
        value: Span
      - attribute: k8s.cluster.name
        present: true
      - attribute: linkerd_control_plane_ns
        present: true
      - attribute: linkerd_control_plane_component
        present: true
      - attribute: instrumentation.provider
        value: opentelemetry

  tags:
    k8s.cluster.name:
      entityTagName: k8s.clusterName
      ttl: P1D
    instrumentation.provider:

dashboardTemplates:
  newrelic:
    template: dashboard.json
  opentelemetry:
    template: otel_dashboard.json

configuration:
  entityExpirationTime: EIGHT_DAYS
  alertable: true

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
