bytesFromIgw:
  title: Bytes from Internet Gateway to VCN
  unit: BYTES
  queries:
    oci:
      select: sum(oci.internet.gateway.bytes.from.igw)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
bytesToIgw:
  title: Bytes from VCN to Internet Gateway
  unit: BYTES
  queries:
    oci:
      select: sum(oci.internet.gateway.bytes.to.igw)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
packetDropsFromIgw:
  title: Packet Drops from Internet Gateway to VCN
  unit: COUNT
  queries:
    oci:
      select: sum(oci.internet.gateway.packet.drops.from.igw)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
packetDropsToIgw:
  title: Packet Drops from VCN to Internet Gateway
  unit: COUNT
  queries:
    oci:
      select: sum(oci.internet.gateway.packet.drops.to.igw)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
