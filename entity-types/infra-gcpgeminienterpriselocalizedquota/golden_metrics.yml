enterprisePlusWtuExceeded:
  title: Enterprise Plus WTU Quota Exceeded
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.quota.ratev2.agentic_wtu_tier_enterprise_plus_ppu_weekly_regional.exceeded`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

enterprisePlusWtuLimit:
  title: Enterprise Plus WTU Quota Limit
  unit: COUNT
  queries:
    gcp:
      select: latest(`gcp.discoveryengine.quota.ratev2.agentic_wtu_tier_enterprise_plus_ppu_weekly_regional.limit`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

