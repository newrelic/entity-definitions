tunnelState:
  title: IPSec Tunnel State (Up=1 / Down=0)
  unit: COUNT
  queries:
    oci:
      select: average(oci.vpn.tunnel.state)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
bytesSent:
  title: Bytes Sent
  unit: BYTES
  queries:
    oci:
      select: sum(oci.vpn.bytes.sent)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
bytesReceived:
  title: Bytes Received
  unit: BYTES
  queries:
    oci:
      select: sum(oci.vpn.bytes.received)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
packetsError:
  title: Packets with Errors
  unit: COUNT
  queries:
    oci:
      select: sum(oci.vpn.packets.error)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
