cpuUtilization:
  title: CPU Utilization
  unit: PERCENTAGE
  queries:
    oci:
      select: average(`oci.redis.cpu.utilization`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

memoryUtilization:
  title: Memory Utilization
  unit: PERCENTAGE
  queries:
    oci:
      select: average(`oci.redis.memory.utilization`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

connectedClients:
  title: Connected Clients
  unit: COUNT
  queries:
    oci:
      select: average(`oci.redis.connected.clients`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

keyspaceHits:
  title: Keyspace Hits
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.redis.keyspace.hits`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
