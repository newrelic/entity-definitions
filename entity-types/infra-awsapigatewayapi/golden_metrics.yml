requests:
  title: Requests
  unit: COUNT
  queries:
    aws:
      select: sum(aws.apigateway.Count.byApi) + filter(sum(aws.apigateway.Count), WHERE Stage IS NULL AND Resource IS NULL)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
    awsSample:
      select: sum(provider.count.SampleCount)
      from: ApiGatewaySample
      where: provider='ApiGatewayApi'
      eventId: entityGuid
      eventName: entityName
errors4XxAnd5Xx:
  title: Errors (4xx and 5xx)
  unit: COUNT
  queries:
    aws:
      select: sum(`aws.apigateway.5XXError.byApi`) + sum(`aws.apigateway.4XXError.byApi`) + filter(sum(`aws.apigateway.5XXError`), WHERE Stage IS NULL AND Resource IS NULL) + filter(sum(`aws.apigateway.4XXError`), WHERE Stage IS NULL AND Resource IS NULL)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
    awsSample:
      select: sum(`provider.5xxError.Sum`) + sum(`provider.4xxError.Sum`)
      from: ApiGatewaySample
      where: provider='ApiGatewayApi'
      eventId: entityGuid
      eventName: entityName
latencyMs:
  title: Latency (ms)
  unit: MS
  queries:
    aws:
      select: average(aws.apigateway.Latency.byApi) + filter(average(aws.apigateway.Latency), WHERE Stage IS NULL AND Resource IS NULL)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
    awsSample:
      select: average(provider.latency.Average)
      from: ApiGatewaySample
      where: provider='ApiGatewayApi'
      eventId: entityGuid
      eventName: entityName
