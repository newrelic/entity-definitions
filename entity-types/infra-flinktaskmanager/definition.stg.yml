domain: INFRA
type: FLINKTASKMANAGER

synthesis:
  rules:
  # OTel Collector Contrib (full GitHub URL) — confirmed otel.library.name in NRDB
  - ruleName: infra_flinktaskmanager_otel_contrib
    identifier: flink.taskmanager.id
    name: flink.taskmanager.id
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: metricName
        prefix: flink.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/flinkmetricsreceiver"
      - attribute: flink.taskmanager.id
        present: true
    tags:
      flink.taskmanager.id:
        ttl: P1D
      flink.resource.type:
      host.name:
        ttl: P1D
      host.id:
        ttl: P1D
      host.type:
      cloud.provider:
      cloud.account.id:
      cloud.region:
      k8s.cluster.name:
        ttl: P1D
      k8s.namespace.name:
        ttl: P1D
      k8s.pod.name:
        ttl: P1D
      otel.library.name:
        entityTagName: instrumentation.name

  # NRDOT short-form (canonical receiver type: flink_metrics)
  - ruleName: infra_flinktaskmanager_otel
    identifier: flink.taskmanager.id
    name: flink.taskmanager.id
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: metricName
        prefix: flink.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/flink_metricsreceiver"
      - attribute: flink.taskmanager.id
        present: true
    tags:
      flink.taskmanager.id:
        ttl: P1D
      flink.resource.type:
      host.name:
        ttl: P1D
      host.id:
        ttl: P1D
      host.type:
      cloud.provider:
      cloud.account.id:
      cloud.region:
      k8s.cluster.name:
        ttl: P1D
      k8s.namespace.name:
        ttl: P1D
      k8s.pod.name:
        ttl: P1D
      otel.library.name:
        entityTagName: instrumentation.name

  # Native: nri-flink with REMOTE_MONITORING=true (one entity per TaskManager)
  # nri-flink (SDK v3) reports this sample on its own remote entity. These types are new, so the rule
  # is a standard one (no legacyFeatures): entityKey is unique per cluster and name, and the entity
  # GUID is hashed from it. Events get entity.guid / entity.name from synthesis.
  - ruleName: infra_flinktaskmanager_nri_flink
    identifier: entityKey
    name: taskmanager.id
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: FlinkTaskManagerSample
      # Only remote-monitoring samples are separate entities; local ones carry the host's entityKey.
      - attribute: jobmanager.endpoint
        present: true
    prefixedTags:
      label.:
        ttl: PT4H
    tags:
      taskmanager.id:
        entityTagName: flink.taskmanager.id
        ttl: P1D
      taskmanager.host:
        ttl: P1D
      hostname:
        ttl: P1D
      port:
        ttl: P1D
      clusterName:
        entityTagName: k8s.cluster.name
        ttl: P1D
      integrationName:
        ttl: P1D
      integrationVersion:
        ttl: P1D
      reportingAgent:
        ttl: P1D

  tags:
    telemetry.sdk.name:
      entityTagName: instrumentation.provider

goldenTags:
  - flink.taskmanager.id
  - flink.resource.type
  - host.name
  - host.id
  - taskmanager.host

configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  newRelic:
    template: newrelic_dashboard.stg.json
  opentelemetry:
    template: opentelemetry_dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
