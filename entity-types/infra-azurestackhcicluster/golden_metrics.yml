percentageCpuGuest:
  title: CPU used by guests (%)
  unit: PERCENTAGE
  queries:
    azure:
      select: average(azure.azurestackhci.clusters.ClusternodeCPUUsageGuest)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
percentageMemory:
  title: Memory allocated (%)
  unit: PERCENTAGE
  queries:
    azure:
      select: average(azure.azurestackhci.clusters.ClusterNodeMemoryUsage)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
volumeIops:
  title: Volume IOPS
  unit: OPERATIONS_PER_SECOND
  queries:
    azure:
      select: average(azure.azurestackhci.clusters.VolumeIOPSTotal)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
volumeThroughput:
  title: Volume throughput
  unit: BYTES_PER_SECOND
  queries:
    azure:
      select: average(azure.azurestackhci.clusters.VolumeThroughputTotal)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
storageDegraded:
  title: Degraded drives
  unit: COUNT
  queries:
    azure:
      select: latest(azure.azurestackhci.clusters.ClusterNodeStorageDegraded)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
