domain: INFRA
type: OCIDNS
goldenTags:
- oci.compartmentId
- oci.region
- oci.displayName
- oci.lifecycleState
- oci.zoneType
configuration:
  entityExpirationTime: DAILY
  alertable: true
synthesis:
  tags:
    newrelic.cloudIntegrations.providerAccountName:
      entityTagNames: [newrelic.cloudIntegrations.providerAccountName, providerAccountName]
      multiValue: false
  rules:
  - ruleName: infra_ocidns_oci_resourceId
    identifier: oci.resourceId
    name: oci.resourceName
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: oci.resourceId
      prefix: "ocid1.dns-zone"
    - attribute: oci.namespace
      value: "oci_dns"
  - ruleName: infra_ocidns_resolver_logs
    identifier: source
    name: logging.oci.displayName
    encodeIdentifierInGUID: true
    conditions:
    - attribute: source
      prefix: "ocid1.dnsresolver"
    - attribute: type
      value: "com.oraclecloud.dns.private.resolver"

ownership:
  primaryOwner:
    teamName: "Cloud Monitoring Platform"
