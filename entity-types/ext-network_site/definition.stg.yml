domain: EXT
type: NETWORK_SITE
synthesis:
  rules:
    - ruleName: ext_network_site_id
      compositeName:
        fragments:
          - attribute: vendorSiteName
          - value: " ("
          - attribute: vendor
          - value: ")"
      compositeIdentifier:
        separator: ":"
        attributes:
          - vendor
          - vendorSiteId
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: NetworkTopology
        - attribute: networkEntityType
          value: NETWORK_SITE
        - attribute: vendorSiteId
          present: true
      tags:
        vendorSiteId:
          entityTagName: vendorSiteId
          multiValue: false
        vendorSiteName:
          entityTagName: vendorSiteName
          multiValue: false
        vendorOrgId:
          entityTagName: vendorOrgId
          multiValue: false
        vendor:
          entityTagName: vendor
          multiValue: false
        region:
          entityTagName: region
          multiValue: false
        latitude:
          entityTagName: latitude
          multiValue: false
        longitude:
          entityTagName: longitude
          multiValue: false
        timezone:
          entityTagName: timezone
          multiValue: false
      # Add a 1 day ttl on all tags ingested in metric api using tags. prefix
      prefixedTags:
        tags.:
          ttl: P1D

goldenTags:
  - vendor
  - region
  - vendorOrgId
  - vendorSiteId

ownership:
  primaryOwner:
    teamName: "Network Monitoring"