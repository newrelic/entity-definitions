publishedEvents:
  title: Published Events
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.cloudevents.published.events`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
matchedEvents:
  title: Matched Events
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.cloudevents.matched.events`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
