domain: EXT
type: PORT
synthesis:
  rules:
  - ruleName: ext_port_from_networktopology_event
    compositeIdentifier:
      separator: ":"
      attributes:
        - deviceName
        - port
    encodeIdentifierInGUID: true
    compositeName:
      fragments:
        - attribute: normalizedDeviceName
        - value: ":"
        - attribute: port
    conditions:
    - attribute: eventType
      value: NetworkTopology
    - attribute: networkEntityType
      anyOf: ["PORT"]
    - attribute: deviceName
      present: true
    - attribute: port
      present: true
    tags:
      deviceName:
        entityTagName: deviceHostname       # owning device name, case-preserved (display/golden tag)
      normalizedDeviceName:
        entityTagName: normalizedDeviceHostname   # owning device name, normalized (far-port match tier)
      observedMac:
        entityTagName: deviceMac            # owning device's MAC (best-effort)
      managementIp:
        entityTagName: deviceManagementIp
      port:
        entityTagName: port
      networkEntityType:
        entityTagName: deviceType
      vendor:
        entityTagName: vendor

goldenTags:
  - deviceHostname
  - deviceMac
  - port

ownership:
  primaryOwner:
    teamName: "Network Monitoring"
