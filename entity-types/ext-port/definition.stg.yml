# Network monitoring entity — EXT/PORT, EXT-only topology port node.
# Design: docs/superpowers/specs/2026-07-08-network-topology-ext-only.md
#
# The port node in the EXT-only topology (replaces the former INFRA/NETWORK_PORT). Keyed on the
# owning device's identity + port name: `device_name : port`. Built from the Networking event for all
# sources. Exposes the owning device's match tags (deviceMac / deviceManagementIp / deviceHostname) +
# port so the EXT/PORT candidate can resolve a far port by any of them + port name.
#
# `deviceHostname` = the owning device's `device_name`, the reliable far-port match tier; `deviceMac`
# is best-effort. Identity uses device_name (matches the EXT device identity) — no separate deviceKey.
domain: EXT
type: PORT
synthesis:
  rules:
  - ruleName: ext_port_from_networking_event
    compositeIdentifier:
      separator: ":"
      attributes:
        - device_name
        - port
    encodeIdentifierInGUID: true
    name: port
    conditions:
    - attribute: eventType
      value: Networking
    - attribute: device_name
      present: true
    - attribute: port
      present: true
    tags:
      device_name:
        entityTagName: deviceHostname       # owning device name as the far-port match tier
      observedMac:
        entityTagName: deviceMac            # owning device's MAC (best-effort)
      managementIp:
        entityTagName: deviceManagementIp
      port:
        entityTagName: port
      extType:
        entityTagName: deviceType
      vendor:
        entityTagName: vendor

goldenTags:
  - deviceHostname
  - deviceMac
  - port

ownership:
  primaryOwner:
    teamName: "Network Monitoring"
