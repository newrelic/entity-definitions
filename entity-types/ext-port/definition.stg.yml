domain: EXT
type: PORT
synthesis:
  rules:
  - ruleName: ext_port_from_networktopology_event
    compositeIdentifier:
      separator: ":"
      attributes:
        - identifier
        - port
    encodeIdentifierInGUID: true
    compositeName:
      fragments:
        - attribute: deviceName
        - value: ":"
        - attribute: port
    conditions:
    - attribute: eventType
      value: NetworkTopology
    - attribute: networkEntityType
      value: PORT
    - attribute: deviceName
      present: true
    - attribute: port
      present: true
    - attribute: identifier
      present: true
    tags:
      deviceName:
        entityTagName: deviceHostname       # owning device name, case-preserved (display/golden tag)
        multiValue: false
      normalizedDeviceName:
        entityTagName: normalizedDeviceHostname   # owning device name, normalized (far-port match tier)
        multiValue: false
      observedMac:
        entityTagName: deviceMac            # owning device's MAC (best-effort)
        multiValue: false
      managementIp:
        entityTagName: deviceManagementIp
        multiValue: false
      port:
        entityTagName: port
        multiValue: false
      networkEntityType:
        entityTagName: deviceType
        multiValue: false
      vendor:
        entityTagName: vendor
        multiValue: false
      siteId:
        entityTagName: siteId
        multiValue: false
      siteName:
        entityTagName: siteName
        multiValue: false
      status:
        entityTagName: status
        multiValue: false

goldenTags:
  - deviceHostname
  - deviceMac
  - port

ownership:
  primaryOwner:
    teamName: "Network Monitoring"


configuration:
  entityExpirationTime: FOUR_HOURS