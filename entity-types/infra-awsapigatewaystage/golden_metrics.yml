requests:
  title: Requests
  unit: COUNT
  queries:
    aws:
      select: sum(aws.apigateway.Count.byApi) + filter(sum(aws.apigateway.Count), WHERE aws.apigateway.Stage IS NOT NULL AND aws.apigateway.Resource IS NULL)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
    awsSample:
      select: sum(provider.count.SampleCount)
      from: ApiGatewaySample
      where: provider='ApiGatewayStage'
      eventId: entityGuid
      eventName: entityName
errors4XxAnd5Xx:
  title: Errors (4xx and 5xx)
  unit: COUNT
  queries:
    aws:
      select: sum(`aws.apigateway.4XXError.byApi`) + sum(`aws.apigateway.5XXError.byApi`) + filter(sum(`aws.apigateway.4XXError`), WHERE aws.apigateway.Stage IS NOT NULL AND aws.apigateway.Resource IS NULL) + filter(sum(`aws.apigateway.5XXError`), WHERE aws.apigateway.Stage IS NOT NULL AND aws.apigateway.Resource IS NULL) AS 'Errors (4xx and 5xx)'
      from: Metric
      eventId: entity.guid
      eventName: entity.name
    awsSample:
      select: sum(`provider.4xxError.Sum`) + sum(`provider.5xxError.Sum`)
      from: ApiGatewaySample
      where: provider='ApiGatewayStage'
      eventId: entityGuid
      eventName: entityName
latencyMs:
  title: Latency (ms)
  unit: MS
  queries:
    aws:
      select: filter(average(aws.apigateway.Latency), WHERE aws.apigateway.Stage IS NOT NULL AND aws.apigateway.Resource IS NULL) OR average(aws.apigateway.Latency.byStage)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
    awsSample:
      select: average(provider.latency.Average)
      from: ApiGatewaySample
      where: provider='ApiGatewayStage'
      eventId: entityGuid
      eventName: entityName
