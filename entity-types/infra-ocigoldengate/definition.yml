domain: INFRA
type: OCIGOLDENGATE
goldenTags:
- oci.compartmentId
- oci.displayName
- oci.lifecycleState
- oci.region
configuration:
  entityExpirationTime: DAILY
  alertable: true
synthesis:
  tags:
    newrelic.cloudIntegrations.providerAccountName:
      entityTagNames: [newrelic.cloudIntegrations.providerAccountName, providerAccountName]
      multiValue: false
  rules:
  - ruleName: infra_ocigoldengate_oci_resourceId
    identifier: oci.resourceId
    name: oci.resourceName
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: oci.resourceId
      prefix: "ocid1.goldengatedeployment.oc1"
    - attribute: oci.namespace
      value: "oci_goldengate"
  - ruleName: infra_ocigoldengate_logs
    identifier: data.resourceId
    name: logging.oci.displayName
    encodeIdentifierInGUID: true
    conditions:
    - attribute: data.resourceId
      prefix: "ocid1.goldengatedeployment"
    - attribute: type
      prefix: "com.oraclecloud.goldengate.deployment"

ownership:
  primaryOwner:
    teamName: "Cloud Monitoring Platform"
