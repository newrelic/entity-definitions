egressBytes:
  title: Egress Data
  unit: BYTES
  queries:
    oci:
      select: sum(`oci.mediastreams.egress.bytes`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

requestCount:
  title: Request Count
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.mediastreams.request.count`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
