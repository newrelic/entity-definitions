bytesToService:
  title: Bytes to Service
  unit: BYTES
  queries:
    oci:
      select: sum(`oci.service.gateway.bytes.to.service`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
bytesFromService:
  title: Bytes from Service
  unit: BYTES
  queries:
    oci:
      select: sum(`oci.service.gateway.bytes.from.service`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
sgwDropsToService:
  title: Packet Drops to Service
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.service.gateway.sgw.drops.to.service`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
sgwDropsFromService:
  title: Packet Drops from Service
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.service.gateway.sgw.drops.from.service`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
