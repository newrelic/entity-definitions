domain: EXT
type: NETWORK_DEVICE
synthesis:
  rules:
  - ruleName: ext_network_device_from_networktopology_event_by_serial
    identifier: serial
    name: deviceName
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: NetworkTopology
    - attribute: networkEntityType
      value: NETWORK_DEVICE
    - attribute: deviceName
      present: true
    - attribute: serial
      present: true
    tags:
      normalizedDeviceName:
        entityTagName: normalizedName
      observedMac:
        entityTagName: mac
      managementIp:
        entityTagName: managementIp
      source:
        entityTagName: source
      serial:
        entityTagName: serial
      vendor:
        entityTagName: vendor
      model:
        entityTagName: model
      siteId:
        entityTagName: siteId
      siteName:
        entityTagName: siteName

  - ruleName: ext_network_device_from_networktopology_event
    identifier: deviceName
    name: deviceName
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: NetworkTopology
    - attribute: networkEntityType
      value: NETWORK_DEVICE
    - attribute: deviceName
      present: true
    - attribute: serial
      present: false
    tags:
      normalizedDeviceName:
        entityTagName: normalizedName
      observedMac:
        entityTagName: mac
      managementIp:
        entityTagName: managementIp
      source:
        entityTagName: source
      serial:
        entityTagName: serial
      vendor:
        entityTagName: vendor
      model:
        entityTagName: model
      siteId:
        entityTagName: siteId
      siteName:
        entityTagName: siteName

goldenTags:
- vendor
- model

ownership:
  primaryOwner:
    teamName: "Network Monitoring"
