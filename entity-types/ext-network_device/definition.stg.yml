domain: EXT
type: NETWORK_DEVICE
synthesis:
  rules:
  - ruleName: ext_network_device_from_networktopology_event
    identifier: identifier
    name: deviceName
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: NetworkTopology
    - attribute: networkEntityType
      value: NETWORK_DEVICE
    - attribute: deviceName
      present: true
    - attribute: identifier
      present: true
    tags:
      identifier:
        entityTagName: identifier
        multiValue: false
      normalizedDeviceName:
        entityTagName: normalizedName
        multiValue: false
      observedMac:
        entityTagName: mac
        multiValue: false
      managementIp:
        entityTagName: managementIp
        multiValue: false
      source:
        entityTagName: source
        multiValue: false
      serial:
        entityTagName: serial
        multiValue: false
      vendor:
        entityTagName: vendor
        multiValue: false
      model:
        entityTagName: model
        multiValue: false
      vendorSiteId:
        entityTagName: vendorSiteId
        multiValue: false
      vendorSiteName:
        entityTagName: vendorSiteName
        multiValue: false
      vendorOrgId:
        entityTagName: vendorOrgId
        multiValue: false
      vendorOrgName:
        entityTagName: vendorOrgName
        multiValue: false
      status:
        entityTagName: status
        multiValue: false
      stackId:
        entityTagName: stackId
        multiValue: false
      normalizedStackName:
        entityTagName: stackName
        multiValue: false

goldenTags:
- vendor
- model

ownership:
  primaryOwner:
    teamName: "Network Monitoring"
