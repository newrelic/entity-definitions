domain: INFRA
type: VSPHERECLUSTER
goldenTags:
- vsphere.clusterDatacenterLocation
- vsphere.clusterDatacenterName
- vsphere.clusterHostList
- vsphere.clusterDatastoreList
configuration:
  entityExpirationTime: DAILY
  alertable: true

synthesis:
  rules:

    # Data from vsphere integration OHI
    - ruleName: infra_vspherecluster_entityId
      identifier: entityId
      name: entityName
      legacyFeatures:
        useNonStandardAttributes: true
        overrideGuidType: true
      conditions:
        - attribute: eventType
          value: VSphereClusterSample
      prefixedTags:
        label.:
          ttl: PT4H
      tags:
        integrationName:
          ttl: P1D
        integrationVersion:
          ttl: P1D
        reportingAgent:
          ttl: P1D


dashboardTemplates:
  # This should match the entity created from the ohi in the infra pipeline
  newRelic:
    template: newrelic_dashboard.json

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
