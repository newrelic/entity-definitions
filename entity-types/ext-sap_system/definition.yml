domain: EXT
type: SAP_SYSTEM
goldenTags:
  - SYS_ID 

synthesis:
  rules:
  # Telemetry from New Relic SAP integration
  - ruleName: ext_sap_system_SAP_EID
    identifier: SAP_EID
    name: SYS_ID
    encodeIdentifierInGUID: true
    conditions:
    - attribute: SAP_ETYPE
      value: SYSTEM
    - attribute: instrumentation_proivder
      value: SAP

    tags:
      SYS_ID:
        entityTagName: sap.system

  - ruleName: oltp_sap_SAP_EID 
    identifier: SAP_EID 
    name: SAP_EID 
    encodeIdentifierInGUID: true
    conditions:
    - attribute: collector.name 
      value: nr-sap-connector 
    - attribute: SAP_ETYPE 
      value: SYSTEM 
    
    tags:
      service.name:
        entityTagName: sap.system

dashboardTemplates:
  SAP:
    template: dashboard.json
  opentelemetry:
    template: dashboard.json


configuration:
  entityExpirationTime: QUARTERLY
  alertable: true

ownership:
  primaryOwner:
    teamName: "New Relic Monitoring for SAP Solutions Team" 
