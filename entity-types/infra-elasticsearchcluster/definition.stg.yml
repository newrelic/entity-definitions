domain: INFRA
type: ELASTICSEARCHCLUSTER

goldenTags:
- elasticsearch.cluster.name
- host.name

configuration:
  entityExpirationTime: DAILY
  alertable: true

synthesis:
  rules:
  - ruleName: infra_elasticsearchcluster_elasticsearch_cluster_name
    identifier: elasticsearch.cluster.name
    name: elasticsearch.cluster.name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: Metric
    - attribute: instrumentation.provider
      value: opentelemetry
    - attribute: otel.library.name
      value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/elasticsearchreceiver"  
    - attribute: elasticsearch.cluster.name
      present: true
    - attribute: elasticsearch.node.name
      present: false
    tags:
      otel.library.name:
        entityTagName: instrumentation.name
      elasticsearch.cluster.name:
        ttl: P1D
      host.name:
        ttl: P1D
  - ruleName: infra_elasticsearchcluster_elasticsearch_cluster_name_2
    identifier: elasticsearch.cluster.name
    name: elasticsearch.cluster.name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: Metric
    - attribute: instrumentation.provider
      value: opentelemetry
    - attribute: otel.library.name
      value: "otelcol/elasticsearchreceiver"  
    - attribute: elasticsearch.cluster.name
      present: true
    - attribute: elasticsearch.node.name
      present: false  
    tags:
      otel.library.name:
        entityTagName: instrumentation.name
      elasticsearch.cluster.name:
        ttl: P1D
      host.name:
        ttl: P1D
  - ruleName: infra_elasticsearchcluster_elasticsearch_cluster_name_3
    identifier: elasticsearch.cluster.name
    name: elasticsearch.cluster.name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: Log
    - attribute: instrumentation.provider
      value: opentelemetry
    - attribute: newrelic.source
      value: 'api.logs.otlp'  
    - attribute: elasticsearch.cluster.name
      present: true
    - attribute: elasticsearch.node.name
      present: false  
    tags:
      instrumentation.provider:
        entityTagName: instrumentation.name
      elasticsearch.cluster.name:
        ttl: P1D
      host.name:
        ttl: P1D
  - ruleName: infra_elasticsearchcluster_elasticsearch_cluster_name_4
    identifier: elasticsearch.cluster.name
    name: elasticsearch.cluster.name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: Metric
    - attribute: instrumentation.provider
      value: opentelemetry
    - attribute: otel.library.name
      value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"  
    - attribute: elasticsearch.cluster.name
      present: true
    - attribute: elasticsearch.node.name
      present: false  
    tags:
      otel.library.name:
        entityTagName: instrumentation.name
      elasticsearch.cluster.name:
        ttl: P1D
      host.name:
        ttl: P1D

  # Distributed Tracing: attach Elasticsearch server spans to the cluster entity.
  # Elasticsearch's built-in tracer (APMTracer) stamps es.cluster.name = the node's
  # configured cluster.name on every span it emits. This rule keys on that attribute,
  # using the same encodeIdentifierInGUID as the metric rules above, so spans and metrics
  # resolve to the SAME ELASTICSEARCHCLUSTER GUID whenever the values match (they do by
  # default, since both derive from cluster.name).
  - ruleName: infra_elasticsearchcluster_otel_span
    identifier: es.cluster.name
    name: es.cluster.name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: Span
    - attribute: instrumentation.provider
      value: opentelemetry
    - attribute: otel.library.name
      value: "elasticsearch"
    - attribute: es.cluster.name
      present: true
    tags:
      otel.library.name:
        entityTagName: instrumentation.name
      es.cluster.name:
        ttl: P1D
      host.name:
        ttl: P1D

  # Data from Elastic search integation OHI
  - ruleName: infra_elasticsearchcluster_entityId
    identifier: entityId
    name: entityName
    legacyFeatures:
      useNonStandardAttributes: true
      overrideGuidType: true
    conditions:
    - attribute: eventType
      value: ElasticsearchClusterSample
    tags:
      displayName:
        entityTagNames: [elasticsearch.cluster.name]

dashboardTemplates:
  newRelic:
      template: newrelic_dashboard.stg.json
  opentelemetry:
    template: opentelemetry_dashboard.json

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
