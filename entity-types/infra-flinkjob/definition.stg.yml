domain: INFRA
type: FLINKJOB

synthesis:
  rules:
  # Composite identifier: host.id scopes the job to the Flink cluster (JobManager host).
  # host.id is present on all metrics via the resourcedetection processor, so job-scoped
  # metrics (checkpoints, restarts) synthesize correctly without needing flink.taskmanager.id.
  - ruleName: infra_flinkjob_otel_contrib
    compositeIdentifier:
      separator: ":"
      attributes:
      - host.id
      - flink.job.name
    name: flink.job.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: metricName
        prefix: flink.job.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/flinkmetricsreceiver"
      - attribute: flink.job.name
        present: true
      - attribute: host.id
        present: true
    tags:
      flink.job.name:
        ttl: P1D
      flink.resource.type:
      host.name:
        ttl: P1D
      host.id:
        ttl: P1D
      host.type:
      cloud.provider:
      cloud.account.id:
      cloud.region:
      k8s.cluster.name:
        ttl: P1D
      k8s.namespace.name:
        ttl: P1D
      k8s.pod.name:
        ttl: P1D
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_flinkjob_otel
    compositeIdentifier:
      separator: ":"
      attributes:
      - host.id
      - flink.job.name
    name: flink.job.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: metricName
        prefix: flink.job.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/flink_metricsreceiver"
      - attribute: flink.job.name
        present: true
      - attribute: host.id
        present: true
    tags:
      flink.job.name:
        ttl: P1D
      flink.resource.type:
      host.name:
        ttl: P1D
      host.id:
        ttl: P1D
      host.type:
      cloud.provider:
      cloud.account.id:
      cloud.region:
      k8s.cluster.name:
        ttl: P1D
      k8s.namespace.name:
        ttl: P1D
      k8s.pod.name:
        ttl: P1D
      otel.library.name:
        entityTagName: instrumentation.name

  # Native: nri-flink with REMOTE_MONITORING=true (one entity per job name and cluster)
  # nri-flink (SDK v3) reports this sample on its own remote entity. These types are new, so the rule
  # is a standard one (no legacyFeatures): entityKey is unique per cluster and name, and the entity
  # GUID is hashed from it. Events get entity.guid / entity.name from synthesis.
  - ruleName: infra_flinkjob_nri_flink
    identifier: entityKey
    name: job.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: FlinkJobSample
      # Only remote-monitoring samples are separate entities; local ones carry the host's entityKey.
      - attribute: jobmanager.endpoint
        present: true
    prefixedTags:
      label.:
        ttl: PT4H
    tags:
      job.name:
        entityTagName: flink.job.name
        ttl: P1D
      job.id:
        ttl: P1D
      hostname:
        ttl: P1D
      port:
        ttl: P1D
      clusterName:
        entityTagName: k8s.cluster.name
        ttl: P1D
      integrationName:
        ttl: P1D
      integrationVersion:
        ttl: P1D
      reportingAgent:
        ttl: P1D

  tags:
    telemetry.sdk.name:
      entityTagName: instrumentation.provider

goldenTags:
  - flink.job.name
  - flink.resource.type
  - host.name

configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  newRelic:
    template: newrelic_dashboard.stg.json
  opentelemetry:
    template: opentelemetry_dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
