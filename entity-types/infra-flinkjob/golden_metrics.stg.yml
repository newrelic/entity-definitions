checkpointCount:
  title: Checkpoints Completed (total)
  unit: COUNT
  queries:
    # Both sources report cumulative totals, so both use latest(). The validator rejects
    # expressions (max - min) and mixed value functions across sources (PR #3304 review).
    newRelic:
      select: latest(job.completedCheckpoints)
      from: FlinkJobSample
      eventId: entity.guid
      eventName: entity.name
    opentelemetry:
      select: latest(flink.job.checkpoint.count)
      from: Metric
      where: checkpoint = 'completed' AND instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

