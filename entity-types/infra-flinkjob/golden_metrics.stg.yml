checkpointCount:
  title: Checkpoints Completed (total)
  unit: COUNT
  queries:
    newRelic:
      select: latest(job.completedCheckpoints)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName

checkpointFailed:
  title: Checkpoints Failed (total)
  unit: COUNT
  queries:
    newRelic:
      select: latest(job.failedCheckpoints)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName

lastCheckpointTime:
  title: Last Checkpoint Duration
  unit: MS
  queries:
    newRelic:
      select: latest(job.lastCheckpointDurationMilliseconds)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName
    opentelemetry:
      select: latest(flink.job.last_checkpoint.time)
      from: Metric
      where: instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

restartCount:
  title: Job Restarts
  unit: COUNT
  queries:
    newRelic:
      select: latest(job.restarts)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName

checkpointInProgress:
  title: Checkpoints In Progress
  unit: COUNT
  queries:
    newRelic:
      select: latest(job.inProgressCheckpoints)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName
    opentelemetry:
      select: latest(flink.job.checkpoint.in_progress)
      from: Metric
      where: instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

lastCheckpointSize:
  title: Last Checkpoint Size
  unit: BYTES
  queries:
    newRelic:
      select: latest(job.lastCheckpointSizeBytes)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName
    opentelemetry:
      select: latest(flink.job.last_checkpoint.size)
      from: Metric
      where: instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

# OTel counters are per-interval deltas, so these sum() over the time range.
checkpointCountOtel:
  title: Checkpoints Completed
  unit: COUNT
  queries:
    opentelemetry:
      select: sum(flink.job.checkpoint.count)
      from: Metric
      where: checkpoint = 'completed' AND instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

checkpointFailedOtel:
  title: Checkpoints Failed
  unit: COUNT
  queries:
    opentelemetry:
      select: sum(flink.job.checkpoint.count)
      from: Metric
      where: checkpoint = 'failed' AND instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

restartCountOtel:
  title: Job Restarts
  unit: COUNT
  queries:
    opentelemetry:
      select: sum(flink.job.restart.count)
      from: Metric
      where: instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name
