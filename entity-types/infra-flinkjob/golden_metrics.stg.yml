checkpointCount:
  title: Checkpoints Completed
  unit: COUNT
  queries:
    # nri-flink reports a running total, so the latest value is the cumulative count.
    newRelic:
      select: latest(job.completedCheckpoints)
      from: FlinkJobSample
      eventId: entityGuid
      eventName: entityName
    opentelemetry:
      select: sum(flink.job.checkpoint.count)
      from: Metric
      where: checkpoint = 'completed' AND instrumentation.provider = 'opentelemetry'
      eventId: entity.guid
      eventName: entity.name

