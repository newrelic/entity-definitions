toolLatency:
  title: Tool Latency
  unit: MS
  queries:
    gcp:
      select: average(`gcp.discoveryengine.tool_total_latencies`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

toolLatencyP50:
  title: Tool Latency (p50)
  unit: MS
  queries:
    gcp:
      select: average(`gcp.discoveryengine.tool_total_latencies.p50`)
