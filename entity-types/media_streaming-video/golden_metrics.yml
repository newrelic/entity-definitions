videoStartTime:
  title: Video Start Time (P95)
  unit: MS
  query:
    select: percentile(startupTime, 95)
    from: VideoAction
    where: actionName = 'QOE_AGGREGATE'
    eventName: entity.guid
playbackErrors:
  title: Playback error rate (%)
  unit: PERCENTAGE
  query:
    select: percentage(uniqueCount(viewId), WHERE hadPlaybackError = true)
    from: VideoAction
    where: actionName = 'QOE_AGGREGATE'
    eventName: entity.guid
standardQoeHealthIndex:
  title: Standard QOE Health Index
  unit: PERCENTAGE
  query:
    select: (100 - percentage(uniqueCount(viewId), WHERE startupTime > 4000 OR rebufferingRatio > 40 OR totalRebufferingTime > 18000 OR numberOfErrors > 0)) / 100
    from: VideoAction
    where: actionName = 'QOE_AGGREGATE'
    eventName: entity.guid
cirr:
  title: Connection Induced Rebuffering Ratio (%)
  unit: PERCENTAGE
  query:
    select: 100 * filter(sum(timeSinceBufferBegin), WHERE actionName = 'CONTENT_BUFFER_END' AND bufferType = 'connection') / filter(sum(elapsedTime), WHERE actionName = 'CONTENT_HEARTBEAT')
    from: VideoAction
    eventName: entity.guid
ebvs:
  title: Exits Before Video Start (%)
  unit: PERCENTAGE
  query:
    select: (filter(uniqueCount(viewId), WHERE actionName = 'CONTENT_REQUEST') - filter(uniqueCount(viewId), WHERE actionName = 'CONTENT_START')) / filter(uniqueCount(viewId), WHERE actionName = 'CONTENT_REQUEST') * 100
    from: VideoAction
    eventName: entity.guid
videoStartFailures:
  title: Video Start Failures (%)
  unit: PERCENTAGE
  query:
    select: percentage(uniqueCount(viewId), WHERE hadStartupError = true)
    from: VideoAction
    where: actionName = 'QOE_AGGREGATE'
    eventName: entity.guid
