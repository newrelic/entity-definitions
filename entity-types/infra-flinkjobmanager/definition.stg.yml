domain: INFRA
type: FLINKJOBMANAGER

synthesis:
  rules:
  # Native: nri-flink with REMOTE_MONITORING=true (one entity per JobManager REST endpoint)
  # nri-flink (SDK v3) reports this sample on its own remote entity.
  - ruleName: infra_flinkjobmanager_nri_flink
    identifier: entityId
    name: jobmanager.endpoint
    legacyFeatures:
      useNonStandardAttributes: true
      overrideGuidType: true
    conditions:
      - attribute: eventType
        value: FlinkJobManagerSample
      # Only remote-monitoring samples are separate entities; local ones carry the host's entityKey.
      - attribute: jobmanager.endpoint
        present: true
    prefixedTags:
      label.:
        ttl: PT4H
    tags:
      hostname:
        ttl: P1D
      port:
        ttl: P1D
      clusterName:
        entityTagName: k8s.cluster.name
        ttl: P1D
      integrationName:
        ttl: P1D
      integrationVersion:
        ttl: P1D
      reportingAgent:
        ttl: P1D

  # OpenTelemetry: no rule yet. The flinkmetricsreceiver labels JobManager metrics with the
  # collector's own host.name, which is not a stable identity in Kubernetes. See the proposal.

goldenTags:
  - hostname
  - port
  - k8s.cluster.name

configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  newRelic:
    template: newrelic_dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
