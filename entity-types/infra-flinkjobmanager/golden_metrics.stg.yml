runningJobs:
  title: Running Jobs
  unit: COUNT
  queries:
    newRelic:
      select: latest(jobmanager.runningJobs)
      from: FlinkJobManagerSample
      eventId: entity.guid
      eventName: entity.name

registeredTaskManagers:
  title: Registered TaskManagers
  unit: COUNT
  queries:
    newRelic:
      select: latest(jobmanager.registeredTaskManagers)
      from: FlinkJobManagerSample
      eventId: entity.guid
      eventName: entity.name

taskSlotsAvailable:
  title: Available Task Slots
  unit: COUNT
  queries:
    newRelic:
      select: latest(jobmanager.taskSlotsAvailable)
      from: FlinkJobManagerSample
      eventId: entity.guid
      eventName: entity.name

heapUsed:
  title: Heap Memory Used
  unit: BYTES
  queries:
    newRelic:
      select: latest(jvm.heapUsedBytes)
      from: FlinkJobManagerSample
      eventId: entity.guid
      eventName: entity.name

cpuLoad:
  title: JVM CPU Load
  unit: PERCENTAGE
  queries:
    newRelic:
      select: average(jvm.cpuLoad) * 100
      from: FlinkJobManagerSample
      eventId: entity.guid
      eventName: entity.name
