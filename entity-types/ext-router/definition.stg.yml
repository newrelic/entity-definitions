# Network monitoring entity — EXT/ROUTER, EXT-only topology node.
# Design: docs/superpowers/specs/2026-07-08-network-topology-ext-only.md
#
# See ext-switch for the three-rule structure. Note deviceType `gateway` maps to extType `ROUTER`
# (EXT uses ROUTER, not GATEWAY). Routers are the devices most likely to expose no MAC over SNMP, so
# `observedMac` is often absent and `hostname` is the working match tier.
domain: EXT
type: ROUTER
synthesis:
  rules:
  # 1) UNCHANGED: Network Router devices from Kentik using Metric API.
  - ruleName: ext_router_device_name
    identifier: device_name
    name: device_name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: provider
      value: kentik-router
    tags:
      src_addr:
        entityTagName: device_ip
        multiValue: false
      tags.container_service:
        entityTagName: container_service
        multiValue: false
    prefixedTags:
      tags.:
        ttl: PT4H
  # 1b) UNCHANGED: Mikrotik routers using Metric API.
  - ruleName: ext_router_mikrotik_serialnumber
    identifier: mikrotik.serialnumber
    name: mikrotik.name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: instrumentation.provider
      value: mikrotik-router
    tags:
      instrumentation.provider:
      instrumentation.version:
        entityTagName: agentVersion
      mikrotik.model:
        entityTagName: model
      mikrotik.boardname:
        entityTagName: boardname
      mikrotik.currentfirmware:
        entityTagName: firmware

  # 2) Topology build/enrich from the Networking event (all sources; extType ROUTER = deviceType gateway).
  - ruleName: ext_router_from_networking_event
    identifier: device_name
    name: device_name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: Networking
    - attribute: extType
      value: ROUTER
    - attribute: device_name
      present: true
    tags:
      device_name:
        entityTagName: hostname          # device name as the match tag (the reliable resolver tier)
      observedMac:
        entityTagName: mac               # often absent on routers
      managementIp:
        entityTagName: managementIp
      source:
        entityTagName: source
      serial:
        entityTagName: serial
      vendor:
        entityTagName: vendor
      model:
        entityTagName: model
      isStack:
        entityTagName: isStack
      stackType:
        entityTagName: stackType
      stackMemberCount:
        entityTagName: stackMemberCount
      stackMemberMac:
        entityTagName: stackMemberMac
        multiValue: true
      stackMemberSerial:
        entityTagName: stackMemberSerial
        multiValue: true
      stackMemberRole:
        entityTagName: stackMemberRole
        multiValue: true
      stackMemberModel:
        entityTagName: stackMemberModel
        multiValue: true

  # 3) Drift verdict flags.
  - ruleName: ext_router_drift_flags
    identifier: device_name
    name: device_name
    encodeIdentifierInGUID: true
    conditions:
    - attribute: eventType
      value: NetworkTopologyDiagnostic
    - attribute: extType
      value: ROUTER
    - attribute: device_name
      present: true
    - attribute: detection
      present: true
    tags:
      duplicateSuspected:
        entityTagName: duplicateSuspected
      duplicatePeer:
        entityTagName: duplicatePeer
      duplicateMac:
        entityTagName: duplicateMac
      nameCollisionSuspected:
        entityTagName: nameCollisionSuspected
      collisionMacs:
        entityTagName: collisionMacs
      renameSuspected:
        entityTagName: renameSuspected
      hardwareChangeSuspected:
        entityTagName: hardwareChangeSuspected
      detection:
        entityTagName: lastDetection

goldenTags:
- device_ip
- container_service
- vendor
- model

## Note - these dashboards are overwritten at the entity-ui layer by custom components built by the NR product team
dashboardTemplates:
  # Default
  default:
    template: default-dashboard.json
  # Mikrotik Router from mikrotik-newrelic script
  mikrotik-router:
    template: mikrotik-dashboard.json

ownership:
  primaryOwner:
    teamName: "Network Monitoring"
