domain: INFRA
type: OCINETWORKFIREWALL
goldenTags:
- oci.compartmentId
- oci.displayName
- oci.lifecycleState
- oci.region
- oci.availabilityDomain
- oci.networkFirewallPolicyId
configuration:
  entityExpirationTime: DAILY
  alertable: true
synthesis:
  tags:
    newrelic.cloudIntegrations.providerAccountName:
      entityTagNames: [newrelic.cloudIntegrations.providerAccountName, providerAccountName]
      multiValue: false
  rules:
  - ruleName: infra_ocinetworkfirewall_oci_resourceId
    identifier: oci.resourceId
    name: oci.resourceName
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: oci.resourceId
      prefix: "ocid1.networkfirewall"
    - attribute: oci.namespace
      value: "oci_network_firewall"
  - ruleName: infra_ocinetworkfirewall_logs
    identifier: data.firewall_id
    name: logging.oci.displayName
    encodeIdentifierInGUID: true
    conditions:
    - attribute: data.firewall_id
      prefix: "ocid1.networkfirewall"
    - attribute: type
      prefix: "com.oraclecloud.networkfirewall"

ownership:
  primaryOwner:
    teamName: "Cloud Monitoring Platform"
