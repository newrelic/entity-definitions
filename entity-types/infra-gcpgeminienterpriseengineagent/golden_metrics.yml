sessionCount:
  title: Session Count
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.agent_session_count`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

turnCount:
  title: Turn Count
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.agent_turn_count`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

sessionsWithToolCount:
  title: Sessions With Tool Use
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.agent_session_with_tool_count`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

agentLatency:
  title: Agent Latency
  unit: MS
  queries:
    gcp:
      select: average(`gcp.discoveryengine.agent_total_latencies`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

agentLatencyP95:
  title: Agent Latency (p95)
  unit: MS
  queries:
    gcp:
      select: average(`gcp.discoveryengine.agent_total_latencies.p95`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
