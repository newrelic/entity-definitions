createSecret:
  title: Create Secret
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.secrets.create.secret`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

getSecretBundle:
  title: Get Secret Bundle
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.secrets.get.secret.bundle`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

updateSecret:
  title: Update Secret
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.secrets.update.secret`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

listSecretBundleVersions:
  title: List Secret Bundle Versions
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.secrets.list.secret.bundle.versions`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
