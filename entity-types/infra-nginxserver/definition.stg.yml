domain: INFRA
type: NGINXSERVER

goldenTags:
- nginx.port
- nginx.version
- nginx.edition
- nginx.hostname

synthesis:
  rules:

  - ruleName: infra_nginxserver_composite
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      # All metrics from the receiver starts with the 'nginx.' prefix.
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      # This filters only metrics coming from nginx receiver, given that metrics
      # could differ between different runtime receivers.
      - attribute: otel.library.name
        value: "otelcol/nginxreceiver"
    tags:
      # Default resource attributes
      nginx.server.endpoint:
      nginx.deployment.name:
      # OTel attributes
      # The library name contains the name of the receiver that is used to identify the source
      # and select the dashboard.
      otel.library.name:
        entityTagName: instrumentation.name
  - ruleName: infra_nginxserver_composite_2
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      # All metrics from the receiver starts with the 'nginx.' prefix.
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      # This filters only metrics coming from nginx receiver, given that metrics
      # could differ between different runtime receivers.
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/nginxreceiver"
    tags:
      # Default resource attributes
      nginx.server.endpoint:
      nginx.deployment.name:
      # OTel attributes
      # The library name contains the name of the receiver that is used to identify the source
      # and select the dashboard.
      otel.library.name:
        entityTagName: instrumentation.name
  - ruleName: infra_nginxserver_composite_3
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      - attribute: metricName
        prefix: nginxplus_
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/prometheusreceiver"
    tags:
      nginx.server.endpoint:
      nginx.deployment.name:
      otel.library.name:
        entityTagName: instrumentation.name
  - ruleName: infra_nginxserver_composite_4
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      - attribute: metricName
        prefix: nginxplus_
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
    tags:
      nginx.server.endpoint:
      # Deployment name — exposed as a tag for NGINXSERVER candidate (Path A) lookup.
      nginx.deployment.name:
      otel.library.name:
        entityTagName: instrumentation.name
  - ruleName: infra_nginxserver_composite_5
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Log
      - attribute: newrelic.source
        value: 'api.logs.otlp'
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      - attribute: instrumentation.provider
        value: opentelemetry
    tags:
      nginx.server.endpoint:
      nginx.deployment.name:
  - ruleName: infra_nginxserver_composite_6
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/prometheusreceiver"
    tags:
      nginx.server.endpoint:
      nginx.deployment.name:
      otel.library.name:
        entityTagName: instrumentation.name
  - ruleName: infra_nginxserver_composite_7
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
    tags:
      nginx.server.endpoint:
      nginx.deployment.name:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_address_composite
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.server.address
        - nginx.server.port
    name: nginx.server.address
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: false
      - attribute: nginx.server.address
        present: true
      - attribute: nginx.server.port
        present: true
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/nginxreceiver"
    tags:
      nginx.server.address:
      nginx.server.port:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_address_composite_2
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.server.address
        - nginx.server.port
    name: nginx.server.address
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: false
      - attribute: nginx.server.address
        present: true
      - attribute: nginx.server.port
        present: true
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/nginxreceiver"
    tags:
      nginx.server.address:
      nginx.server.port:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_address_composite_3
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.server.address
        - nginx.server.port
    name: nginx.server.address
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: false
      - attribute: nginx.server.address
        present: true
      - attribute: nginx.server.port
        present: true
      - attribute: metricName
        prefix: nginxplus_
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/prometheusreceiver"
    tags:
      nginx.server.address:
      nginx.server.port:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_address_composite_4
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.server.address
        - nginx.server.port
    name: nginx.server.address
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: false
      - attribute: nginx.server.address
        present: true
      - attribute: nginx.server.port
        present: true
      - attribute: metricName
        prefix: nginxplus_
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
    tags:
      nginx.server.address:
      nginx.server.port:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_address_composite_5
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.server.address
        - nginx.server.port
    name: nginx.server.address
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: false
      - attribute: nginx.server.address
        present: true
      - attribute: nginx.server.port
        present: true
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "otelcol/prometheusreceiver"
    tags:
      nginx.server.address:
      nginx.server.port:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_address_composite_6
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.server.address
        - nginx.server.port
    name: nginx.server.address
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Metric
      - attribute: nginx.deployment.name
        present: false
      - attribute: nginx.server.address
        present: true
      - attribute: nginx.server.port
        present: true
      - attribute: metricName
        prefix: nginx.
      - attribute: instrumentation.provider
        value: opentelemetry
      - attribute: otel.library.name
        value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
    tags:
      nginx.server.address:
      nginx.server.port:
      otel.library.name:
        entityTagName: instrumentation.name

  - ruleName: infra_nginxserver_otel_span
    # Span-based rule. Spans emitted by ngx_otel_module carry no nginx identity by default, so
    # they otherwise fall through to the generic EXT-SERVICE catch-all instead of the real
    # NGINXSERVER entity. When the collector stamps the same nginx.deployment.name +
    # nginx.server.endpoint identity used by the Metric rules onto the spans, this rule resolves
    # them to the SAME entity.guid (same compositeIdentifier), so a span and a metric from the
    # same NGINX process map to one entity.
    compositeIdentifier:
      separator: ":"
      attributes:
        - nginx.deployment.name
        - nginx.server.endpoint
    name: nginx.display.name
    encodeIdentifierInGUID: true
    conditions:
      - attribute: eventType
        value: Span
      - attribute: nginx.deployment.name
        present: true
      - attribute: nginx.server.endpoint
        present: true
      - attribute: nginx.display.name
        present: true
      - attribute: instrumentation.provider
        value: opentelemetry
    tags:
      nginx.server.endpoint:
      nginx.deployment.name:

    # nri-nginx / NginxSample
  - ruleName: infra_nginxserver_entityId
    identifier: entityId
    name: entityName
    legacyFeatures:
      useNonStandardAttributes: true
      overrideGuidType: true
    prefixedTags:
      label.:
        ttl: PT4H
    conditions:
      - attribute: eventType
        value: 'NginxSample'
    tags:
      integrationName:
        ttl: P1D
      integrationVersion:
        ttl: P1D
      reportingAgent:
        ttl: P1D
      software.version:
        ttl: P1D

  tags:
    # For OpenTelemetry
    telemetry.sdk.name:
      entityTagName: instrumentation.provider

configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  # This should match the entity created from the ohi in the infra pipeline
  newRelic:
    template: newrelic_dashboard.json
  # otel receiver
  opentelemetry:
    template: opentelemetry_dashboard.json

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
