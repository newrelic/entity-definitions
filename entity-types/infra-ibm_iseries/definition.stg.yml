domain: INFRA
type: IBM_ISERIES

goldenTags:
- systemName
- ipAddress

synthesis:
  ruleName: infra_ibm_iseries_hostname
  name: hostName
  identifier: hostName
  encodeIdentifierInGUID : true
  conditions:
  - attribute: includeInIseriesEntity
    present: true
  tags:
    systemName:
      multiValue: false
    ipAddress:
      multiValue: false
configuration:
  alertable: true
  entityExpirationTime: DAILY

dashboardTemplates:
  newRelic:
    template: dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "no owner"
