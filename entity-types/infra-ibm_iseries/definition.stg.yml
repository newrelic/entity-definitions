domain: INFRA
type: IBM_ISERIES

goldenTags:
- systemName


synthesis:
  ruleName: infra_ibm_iseries_hostname
  name: hostName
  identifier: hostName
  encodeIdentifierInGUID: true
  conditions:
  - attribute: eventType
    prefix: "AS400:"
  - attribute: includeInIseriesEntity
    present: true
  tags:
    systemName:
      multiValue: false
configuration:
  alertable: true
  entityExpirationTime: DAILY

dashboardTemplates:
  newRelic:
    template: dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "no owner"
