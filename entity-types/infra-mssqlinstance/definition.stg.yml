domain: INFRA
type: MSSQLINSTANCE

synthesis:
  rules:
    - ruleName: infra_mssqlinstance_entityId
      identifier: entityId
      name: entityName
      legacyFeatures:
        useNonStandardAttributes: true
        overrideGuidType: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: event_type
          value: "MssqlInstanceSample"
      tags:
        integrationName:
          ttl: P1D
        integrationVersion:
          ttl: P1D
        reportingAgent:
          ttl: P1D
        entityKey:
          ttl: P1D

    - ruleName: infra_mssqlinstance_host_name_metrics_nrfork
      identifier: host.name
      name: host.name
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: sqlserver.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: sqlserver.host.name
          present: false
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        host.name:
          entityTagNames: [server.address, endpoint]
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_host_name_metrics_nrfork_2
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: sqlserver.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: sqlserver.host.name
          present: true
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        server.address:
          entityTagNames: [server.address]
        server.port:
          entityTagName: server.port
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_host_name_logs
      identifier: host.name
      name: host.name
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: event.name
          prefix: db.server.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        host.name:
          entityTagNames: [server.address, endpoint]
        db.namespace:
          entityTagName: database.name
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_host_name_metrics
      identifier: host.name
      name: host.name
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: sqlserver.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        host.name:
          entityTagNames: [server.address, endpoint]
        db.namespace:
          entityTagName: database.name
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_service.instance.id_metrics_sqlqueryreceiver
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: sqlserver.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlqueryreceiver
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_host_name_logs_nrfork
      identifier: host.name
      name: host.name
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: event.name
          prefix: db.server.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/newrelic-forks/opentelemetry-collector-contrib/receiver/nrsqlserverreceiver
        - attribute: sqlserver.host.name
          present: false
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        host.name:
          entityTagNames: [server.address, endpoint]
        db.namespace:
          entityTagName: database.name
        otel.library.version:
          entityTagName: instrumentation.version

    - ruleName: infra_mssqlinstance_host_name_logs_nrfork_2
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: eventType
          value: Log
        - attribute: event.name
          prefix: db.server.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/newrelic-forks/opentelemetry-collector-contrib/receiver/nrsqlserverreceiver
        - attribute: sqlserver.host.name
          present: true
      tags:
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
          entityTagName: instrumentation.provider
        server.address:
          entityTagNames: [server.address]
        server.port:
          entityTagName: server.port
        db.namespace:
          entityTagName: database.name
        otel.library.version:
          entityTagName: instrumentation.version

    # nrsp-pipelines db-event-namespace processor stamps db.server.* log events with a
    # curated eventType (DbServerTopQuery, DbServerQuerySample, DbServerQueryPlan,
    # DbServerTopProcedure) and a `namespace` attribute. The
    # DbServer prefix is shared across DB engines, so db.system.name disambiguates SQL Server.
    # Dual-keyed on sqlserver.host.name presence, matching the other mssqlinstance log rules.
    - ruleName: infra_mssqlinstance_db_server_events
      identifier: host.name
      name: host.name
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          prefix: DbServer
        - attribute: db.system.name
          value: microsoft.sql_server
        - attribute: sqlserver.host.name
          present: false
      tags:
        namespace:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        host.name:
          entityTagNames: [server.address, endpoint]

    - ruleName: infra_mssqlinstance_db_server_events_2
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          prefix: DbServer
        - attribute: db.system.name
          value: microsoft.sql_server
        - attribute: sqlserver.host.name
          present: true
      tags:
        namespace:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address]
        server.port:
          entityTagName: server.port


goldenTags:
  - mssql.host
  - mssql.instance
configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  newRelic:
    template: newrelic_dashboard.json
  opentelemetry:
    template: newrelic_otel_sql_dashboard.json

ownership:
  primaryOwner:
    teamName: "Database Integrations"
