domain: EXT
type: AS400

synthesis:
  name: systemName
  identifier: systemName
  encodeIdentifierInGUID: true
  conditions:
  - attribute: eventType
    prefix: 'AS400:'
  tags:
    numberOfProcessors:
    numberOfPartitions:
    partitionIdentifier:
    processorSharingAttribute:

goldenTags:
- systemName
- numberOfProcessors
- partitionIdentifier

dashboardTemplates:
  newRelic:
    template: dashboard.json

configuration:
  entityExpirationTime: EIGHT_DAYS
  alertable: true
