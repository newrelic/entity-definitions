cpuUtilizationPercent:
  title: CPU utilization (%)
  unit: PERCENTAGE
  displayAsValue: true
  query:
    select: latest(percentProcessingUnitUsed)
    from: '`AS400:SystemStatusEvent`'
    eventId: entity.guid

auxStorageUtilizationPercent:
  title: Auxiliary storage utilization (%)
  unit: PERCENTAGE
  displayAsValue: true
  query:
    select: latest(percentSystemASPUsed)
    from: '`AS400:SystemStatusEvent`'
    eventId: entity.guid

activeJobs:
  title: Active jobs
  unit: COUNT
  displayAsValue: true
  query:
    select: latest(numberActiveJobsInSystem)
    from: '`AS400:SystemStatusEvent`'
    eventId: entity.guid

usersSignedOn:
  title: Users signed on
  unit: COUNT
  displayAsValue: true
  query:
    select: latest(currentUsersSignedOn)
    from: '`AS400:SystemStatusEvent`'
    eventId: entity.guid

batchJobsRunning:
  title: Batch jobs running
  unit: COUNT
  displayAsValue: true
  query:
    select: latest(numberOfBatchJobsRunning)
    from: '`AS400:SystemStatusEvent`'
    eventId: entity.guid
