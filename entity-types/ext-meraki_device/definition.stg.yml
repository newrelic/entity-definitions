# Network monitoring entity
domain: EXT
type: MERAKI_DEVICE
synthesis:
  rules:
    # Meraki devices being polled locally through their SNMP interface
    - ruleName: ext_meraki_device_device_name
      name: device_name
      identifier: device_name
      encodeIdentifierInGUID: true
      conditions:
        - attribute: provider
          value: kentik-meraki
        - attribute: instrumentation.name
          value: meraki-device
      tags:
        src_addr:
          entityTagName: device_ip
          multiValue: false
        tags.container_service:
          entityTagName: container_service
          multiValue: false
      # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
      prefixedTags:
        tags.:
          ttl: PT4H
    # Meraki devices being polled via the Meraki Dashboard API using Device Status
    - ruleName: ext_meraki_device_serial
      name: device_name
      identifier: serial
      encodeIdentifierInGUID: true
      conditions:
        - attribute: instrumentation.provider
          value: kentik
        - attribute: instrumentation.name
          value: meraki.device_status
      tags:
        tags.container_service:
          entityTagName: container_service
          multiValue: false
        org_id:
          multiValue: false
        org_name:
          multiValue: false
        network_id:
          multiValue: false
        network:
          multiValue: false
      # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
      prefixedTags:
        tags.:
          ttl: PT4H
    # Meraki devices being polled via the Meraki Dashboard API using Uplink Status
    - ruleName: ext_meraki_device_serial_2
      name: device_name
      identifier: serial
      encodeIdentifierInGUID: true
      conditions:
        - attribute: instrumentation.provider
          value: kentik
        - attribute: instrumentation.name
          value: meraki.uplink_status
      tags:
        tags.container_service:
          entityTagName: container_service
          multiValue: false
        org_id:
          multiValue: false
        org_name:
          multiValue: false
        network_id:
          multiValue: false
        network:
          multiValue: false
      # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
      prefixedTags:
        tags.:
          ttl: PT4H
    # Meraki devices being polled via the Meraki Dashboard API using Uplink Performance
    - ruleName: ext_meraki_device_serial_3
      name: device_name
      identifier: serial
      encodeIdentifierInGUID: true
      conditions:
        - attribute: instrumentation.provider
          value: kentik
        - attribute: instrumentation.name
          value: meraki.uplinks
      tags:
        tags.container_service:
          entityTagName: container_service
          multiValue: false
        org_id:
          multiValue: false
        org_name:
          multiValue: false
        network_id:
          multiValue: false
        network:
          multiValue: false
      # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
      prefixedTags:
        tags.:
          ttl: PT4H
    # Meraki devices being polled via the Meraki Dashboard API using VPN Status
    - ruleName: ext_meraki_device_serial_4
      name: device_name
      identifier: serial
      encodeIdentifierInGUID: true
      conditions:
        - attribute: instrumentation.provider
          value: kentik
        - attribute: instrumentation.name
          value: meraki.vpn_status
      tags:
        tags.container_service:
          entityTagName: container_service
          multiValue: false
        org_id:
          multiValue: false
        org_name:
          multiValue: false
        network_id:
          multiValue: false
        network:
          multiValue: false
      # Add a 4 hour ttl on all tags ingested in metric api using tags. prefix
      prefixedTags:
        tags.:
          ttl: PT4H

    # Topology for meraki_device
    - ruleName: ext_meraki_device_from_networktopology_event
      identifier: identifier
      name: deviceName
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: NetworkTopology
        - attribute: networkEntityType
          value: MERAKI_DEVICE
        - attribute: deviceName
          present: true
        - attribute: identifier
          present: true
      tags:
        identifier:
          entityTagName: identifier
          multiValue: false
        normalizedDeviceName:
          entityTagName: normalizedName
          multiValue: false
        observedMac:
          entityTagName: mac
          multiValue: false
        managementIp:
          entityTagName: managementIp
          multiValue: false
        source:
          entityTagName: source
          multiValue: false
        serial:
          entityTagName: serial
          multiValue: false
        vendor:
          entityTagName: vendor
          multiValue: false
        model:
          entityTagName: model
          multiValue: false
        vendorSiteId:
          entityTagName: vendorSiteId
          multiValue: false
        vendorSiteName:
          entityTagName: vendorSiteName
          multiValue: false
        vendorOrgId:
          entityTagName: vendorOrgId
          multiValue: false
        vendorOrgName:
          entityTagName: vendorOrgName
          multiValue: false
        status:
          entityTagName: status
          multiValue: false
        stackId:
          entityTagName: stackId
          multiValue: false
        normalizedStackName:
          entityTagName: stackName
          multiValue: false

goldenTags:
  - container_service
  - org_name
  - org_id
  - network
  - network_id

dashboardTemplates:
  kentik/meraki-device:
    template: meraki-device-dashboard.json
  kentik:
    template: meraki-device-api-dashboard.json

ownership:
  primaryOwner:
    teamName: "Network Monitoring"