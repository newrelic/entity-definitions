bytesFromNatGateway:
  title: Bytes From NAT Gateway
  unit: BYTES
  queries:
    oci:
      select: sum(`oci.nat.gateway.bytes.from.natgw`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
bytesToNatGateway:
  title: Bytes To NAT Gateway
  unit: BYTES
  queries:
    oci:
      select: sum(`oci.nat.gateway.bytes.to.natgw`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
connectionsEstablished:
  title: Connections Established
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.nat.gateway.connections.established`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
dropsFromNatGateway:
  title: Drops From NAT Gateway
  unit: COUNT
  queries:
    oci:
      select: sum(`oci.nat.gateway.drops.from.natgw`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
