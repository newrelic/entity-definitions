domain: INFRA
type: IBMMQ_MANAGER

synthesis:
  rules:
    # nri-mq rules: native identity = targetName:qmgr. OTel excluded via instrumentation.provider absent
    # so nri-mq and OpenTelemetry never double-synthesize the same queue manager.
    - ruleName: infra_ibmmq_manager_nri_1
      compositeIdentifier:
        separator: ":"
        attributes:
          - targetName
          - qmgr
      name: qmgr
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: ibmmq_qmgr
        - attribute: instrumentation.provider
          present: false
      tags:
        clusterName:

    - ruleName: infra_ibmmq_manager_nri_2
      compositeIdentifier:
        separator: ":"
        attributes:
          - targetName
          - qmgr
      name: qmgr
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: ibmmq_channel
        - attribute: instrumentation.provider
          present: false
      tags:
        clusterName:

    - ruleName: infra_ibmmq_manager_nri_3
      compositeIdentifier:
        separator: ":"
        attributes:
          - targetName
          - qmgr
      name: qmgr
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: ibmmq_subscription
        - attribute: instrumentation.provider
          present: false
      tags:
        clusterName:

    # OpenTelemetry rule (Prometheus receiver): underscored metrics; identity keyed on target.name:qmgr.
    # targetName is intentionally omitted from the identifier so a multi-instance queue manager stays
    # one entity across host failover.
    - ruleName: infra_ibmmq_manager_otel
      compositeIdentifier:
        separator: ":"
        attributes:
          - target.name
          - qmgr
      encodeIdentifierInGUID: true
      name: qmgr
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: ibmmq_qmgr
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: otel.library.name
          value: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
        - attribute: qmgr
          present: true
        - attribute: queue
          present: false
      tags:
        qmgr:
        target.name:
        cluster.name:
          entityTagName: clusterName
        otel.library.name:
          entityTagName: instrumentation.name
        instrumentation.provider:
        server.address:
          ttl: P1D
        host.id:
          ttl: P1D
        host.name:
          ttl: P1D
        k8s.pod.name:
          ttl: P1D
        k8s.node.name:
          ttl: P1D
        k8s.pod.uid:
          ttl: P1D
        k8s.namespace.name:
          ttl: P1D

    # OpenTelemetry Log synthesis rule: associates logs forwarded via the OTel Collector's filelog
    # receiver with the queue manager entity. Without it, logs only appear on the HOST entity's Logs
    # page. Identity mirrors the OTel metric rule (target.name:qmgr) so logs land on the same entity;
    # queue absent keeps queue-scoped logs off the manager.
    - ruleName: infra_ibmmq_manager_otel_logs
      compositeIdentifier:
        separator: ":"
        attributes:
          - target.name
          - qmgr
      encodeIdentifierInGUID: true
      name: qmgr
      conditions:
        - attribute: eventType
          value: Log
        - attribute: newrelic.source
          value: api.logs.otlp
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: target.name
          present: true
        - attribute: qmgr
          present: true
        - attribute: queue
          present: false
      tags:
        qmgr:
        target.name:
        cluster.name:
          entityTagName: clusterName
        instrumentation.provider:
        otel.library.name:
          entityTagName: instrumentation.name
        server.address:
          ttl: P1D
        host.id:
          ttl: P1D
        host.name:
          ttl: P1D
        k8s.pod.name:
          ttl: P1D
        k8s.node.name:
          ttl: P1D
        k8s.pod.uid:
          ttl: P1D
        k8s.namespace.name:
          ttl: P1D

goldenTags:
  - qmgr

dashboardTemplates:
  newRelic:
    template: newrelic_dashboard.json
  opentelemetry:
    template: opentelemetry_dashboard.json

configuration:
  entityExpirationTime: DAILY
  alertable: true

ownership:
  primaryOwner:
    teamName: "OnHost Agent and Integrations"
