engines:
  title: Engines
  unit: COUNT
  queries:
    gcp:
      select: latest(`gcp.discoveryengine.engines_regional`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

dataStores:
  title: Data Stores
  unit: COUNT
  queries:
    gcp:
      select: latest(`gcp.discoveryengine.data_stores_regional`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

documents:
  title: Documents
  unit: COUNT
  queries:
    gcp:
      select: latest(`gcp.discoveryengine.documents_regional`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

userEvents:
  title: User Events
  unit: COUNT
  queries:
    gcp:
      select: latest(`gcp.discoveryengine.user_events_regional`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

searchRequests:
  title: Search Requests
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.search_requests_regional`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

answerTimeToFirstToken:
  title: Answer API Time to First Token
  unit: MS
  queries:
    gcp:
      select: average(`gcp.discoveryengine.conversational_search_service.stream_answer_query.first_token_latencies`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
