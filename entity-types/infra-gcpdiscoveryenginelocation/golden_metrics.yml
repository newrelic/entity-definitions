searchRequests:
  title: Search Requests
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.quota.search_requests_regional.usage`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

searchRequestsOverQuota:
  title: Search Requests Over Quota
  unit: COUNT
  queries:
    gcp:
      select: sum(`gcp.discoveryengine.quota.search_requests_regional.exceeded`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

searchRequestsLimit:
  title: Search Requests Limit
  unit: REQUESTS_PER_MINUTE
  queries:
    gcp:
      select: max(`gcp.discoveryengine.quota.search_requests_regional.limit`)
      from: Metric
      eventId: entity.guid
      eventName: entity.name

