filesystemUtilization:
  title: Filesystem utilization
  unit: PERCENTAGE
  queries:
    azure:
      select: average(azure.azurestackhci.edgemachines.system.filesystem.utilization)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
diskIo:
  title: Disk I/O throughput
  unit: BYTES_PER_SECOND
  queries:
    azure:
      select: average(azure.azurestackhci.edgemachines.system.disk.io)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
networkIo:
  title: Network I/O throughput
  unit: BYTES_PER_SECOND
  queries:
    azure:
      select: average(azure.azurestackhci.edgemachines.system.network.io)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
gpuUtilization:
  title: GPU utilization
  unit: PERCENTAGE
  queries:
    azure:
      select: average(azure.azurestackhci.edgemachines.GpuUtilization)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
