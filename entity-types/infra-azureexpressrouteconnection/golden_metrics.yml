bitsInPerSecond:
  title: Bits In Per Second
  unit: BITS_PER_SECOND
  queries:
    azure:
      select: average(azure.network.connections.BitsInPerSecond)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
bitsOutPerSecond:
  title: Bits Out Per Second
  unit: BITS_PER_SECOND
  queries:
    azure:
      select: average(azure.network.connections.BitsOutPerSecond)
      from: Metric
      eventId: entity.guid
      eventName: entity.name
