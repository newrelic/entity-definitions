domain: INFRA
type: OCIAPIGATEWAY
goldenTags:
- oci.compartmentId
- oci.region
- oci.availabilityDomain
- oci.displayName
- oci.hostname
- oci.lifecycleState
configuration:
  entityExpirationTime: DAILY
  alertable: true
synthesis:
  tags:
    newrelic.cloudIntegrations.providerAccountName:
      entityTagNames: [newrelic.cloudIntegrations.providerAccountName, providerAccountName]
      multiValue: false
  rules:
  - ruleName: infra_ociapigateway_oci_resourceId
    identifier: oci.resourceId
    name: oci.resourceName
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: oci.resourceId
      prefix: "ocid1.apigateway"
    - attribute: oci.namespace
      value: "oci_apigateway"
  # New rule for Access and Execution logs
  - ruleName: infra_ociapigateway_logContent_data_gatewayId
    identifier: data.gatewayId
    name: data.gatewayDisplayName
    legacyFeatures:
      overrideGuidType: true
    encodeIdentifierInGUID: true
    conditions:
    - attribute: data.gatewayId
      prefix: "ocid1.apigateway"
    - attribute: type
      prefix: "com.oraclecloud.apigateway."    

ownership:
  primaryOwner:
    teamName: "Cloud Monitoring Platform"
