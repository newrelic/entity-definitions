domain: INFRA
type: POSTGRESQLINSTANCE

synthesis:
  rules:
    # opentelemetry metrics (postgresqlreceiver / nrpostgresqlreceiver fork). With the
    # useOTelSemconv gate on, service.instance.id becomes a UUID (unreadable as a name),
    # so identify/name by server.address:server.port instead — only present when the gate
    # is on (upstream: opt-in, alpha; fork: default-on, beta).
    - ruleName: infra_postgresqlinstance_service_instance_id
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: postgresql.
        - attribute: instrumentation.provider
          value: opentelemetry
      tags:
        # Environment resource attributes
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # opentelemetry logs (db.server.top_query / db.server.query_sample). Same
    # server.address:server.port identity/name as the metric rule above, for consistency.
    - ruleName: infra_postgresqlinstance_otel_logs
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: db.system.name
          value: postgresql
      tags:
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # nri-postgresql / PostgresqlInstanceSample
    - ruleName: infra_postgresqlinstance_entityId
      identifier: entityId
      name: entityKey
      legacyFeatures:
        useNonStandardAttributes: true
        overrideGuidType: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: eventType
          value: 'PostgresqlInstanceSample'
      tags:
        integrationName:
          ttl: P1D
        integrationVersion:
          ttl: P1D
        reportingAgent:
          ttl: P1D
        reportingEndpoint:
          ttl: P1D

  tags:
    # For OpenTelemetry
    telemetry.sdk.name:
      entityTagName: instrumentation.provider

goldenTags:
- postgres.host
configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  # This should match the entity created from the ohi in the infra pipeline
  newRelic:
    template: newrelic_dashboard.json
  opentelemetry:
    template: opentelemetry_dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "Database Integrations"