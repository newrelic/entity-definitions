domain: INFRA
type: MYSQLNODE

synthesis:
  rules:
    # opentelemetry - metrics (OTel Collector mysqlreceiver). Matching is deliberately
    # loose (any mysql.* metric) — do not re-add an otel.library.name check, it was
    # removed upstream on purpose.
    - ruleName: infra_mysqlnode_mysql_instance_endpoint
      identifier: mysql.instance.endpoint # server.address:server.port
      name: mysql.instance.endpoint
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: mysql.
        - attribute: instrumentation.provider
          value: opentelemetry
      tags:
        # Environment resource attributes
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        # server.address/server.port feed the MYSQLNODE relationship candidate lookup.
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # opentelemetry logs (db.server.top_query / db.server.query_sample). Matches on
    # db.system.name=mysql instead of otel.library.name, since that already disambiguates
    # from other DB receivers (e.g. MSSQL) that also emit db.server.* log events.
    - ruleName: infra_mysqlnode_otel_logs
      identifier: mysql.instance.endpoint
      name: mysql.instance.endpoint
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: db.system.name
          value: mysql
      tags:
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # nri-mysql / MysqlSample
    - ruleName: infra_mysqlnode_entityId
      identifier: entityId
      name: entityName
      legacyFeatures:
        useNonStandardAttributes: true
        overrideGuidType: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: event_type
          value: 'MysqlSample'
      tags:
        integrationName:
          ttl: P1D
        integrationVersion:
          ttl: P1D
        reportingAgent:
          ttl: P1D

  tags:
    # For OpenTelemetry
    telemetry.sdk.name:
      entityTagName: instrumentation.provider

goldenTags:
- mysql.port
- mysql.version
- mysql.edition
- mysql.hostname
- mysql.clusterNodeType

configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  # This should match the entity created from the ohi in the infra pipeline
  newRelic:
    template: newrelic_dashboard.json
  # otel receiver
  opentelemetry:
    template: opentelemetry_dashboard.stg.json

ownership:
  primaryOwner:
    teamName: "Database Integrations"
