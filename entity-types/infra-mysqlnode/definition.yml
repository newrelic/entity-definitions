domain: INFRA
type: MYSQLNODE

synthesis:
  rules:
    # opentelemetry - metrics (OTel Collector mysqlreceiver). Matching is deliberately
    # loose (any mysql.* metric) — do not re-add an otel.library.name check, it was
    # removed upstream on purpose.
    # Identify/name by server.address:server.port directly (same convention adopted by
    # POSTGRESQLINSTANCE/ORACLEDBINSTANCE for the useOTelSemconv resource model) instead
    # of relying on the receiver's own mysql.instance.endpoint attribute. Same value,
    # not dependent on a receiver-specific derived attribute.
    - ruleName: infra_mysqlnode_mysql_instance_endpoint
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: mysql.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: server.address
          present: true
        - attribute: server.port
          present: true
      tags:
        # Environment resource attributes
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        # server.address/server.port feed the MYSQLNODE relationship candidate lookup.
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # Fallback for mysqlreceiver builds that don't emit server.address/server.port
    # (pre useOTelSemconv). Falls back to the older mysql.instance.endpoint identifier
    # so those entities keep matching instead of going unsynthesized.
    - ruleName: infra_mysqlnode_mysql_instance_endpoint_fallback
      identifier: mysql.instance.endpoint
      name: mysql.instance.endpoint
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Metric
        - attribute: metricName
          prefix: mysql.
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: server.address
          present: false
      tags:
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # opentelemetry logs (db.server.top_query / db.server.query_sample). Matches on
    # db.system.name=mysql instead of otel.library.name, since that already disambiguates
    # from other DB receivers (e.g. MSSQL) that also emit db.server.* log events.
    # Same server.address:server.port identity/name as the metric rule above, for consistency.
    - ruleName: infra_mysqlnode_otel_logs
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: db.system.name
          value: mysql
        - attribute: server.address
          present: true
        - attribute: server.port
          present: true
      tags:
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # Fallback for mysqlreceiver builds that don't emit server.address/server.port
    # (pre useOTelSemconv), same rationale as the metric fallback above.
    - ruleName: infra_mysqlnode_otel_logs_fallback
      identifier: mysql.instance.endpoint
      name: mysql.instance.endpoint
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          value: Log
        - attribute: instrumentation.provider
          value: opentelemetry
        - attribute: db.system.name
          value: mysql
        - attribute: server.address
          present: false
      tags:
        host.type:
        cloud.provider:
        cloud.account.id:
        cloud.region:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # nrsp-pipelines db-event-namespace processor stamps db.server.* log events with a
    # curated eventType (DbServerTopQuery, DbServerQuerySample) and a `namespace` attribute. The
    # DbServer prefix is shared across DB engines, so db.system.name disambiguates MySQL.
    # Same server.address:server.port identity/name as the metric/log rules above, for consistency.
    - ruleName: infra_mysqlnode_db_server_events
      compositeIdentifier:
        separator: ":"
        attributes:
          - server.address
          - server.port
      compositeName:
        fragments:
          - attribute: server.address
          - value: ":"
          - attribute: server.port
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          prefix: DbServer
        - attribute: db.system.name
          value: mysql
        - attribute: server.address
          present: true
        - attribute: server.port
          present: true
      tags:
        namespace:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # Fallback for mysqlreceiver builds that don't emit server.address/server.port
    # (pre useOTelSemconv), same rationale as the metric/log fallbacks above.
    - ruleName: infra_mysqlnode_db_server_events_fallback
      identifier: mysql.instance.endpoint
      name: mysql.instance.endpoint
      encodeIdentifierInGUID: true
      conditions:
        - attribute: eventType
          prefix: DbServer
        - attribute: db.system.name
          value: mysql
        - attribute: server.address
          present: false
      tags:
        namespace:
        otel.library.name:
          entityTagName: instrumentation.name
        otel.library.version:
          entityTagName: instrumentation.version
        server.address:
          entityTagNames: [server.address, endpoint]
        server.port:
          entityTagName: server.port

    # nri-mysql / MysqlSample
    - ruleName: infra_mysqlnode_entityId
      identifier: entityId
      name: entityName
      legacyFeatures:
        useNonStandardAttributes: true
        overrideGuidType: true
      prefixedTags:
        label.:
          ttl: PT4H
      conditions:
        - attribute: event_type
          value: 'MysqlSample'
      tags:
        integrationName:
          ttl: P1D
        integrationVersion:
          ttl: P1D
        reportingAgent:
          ttl: P1D

  tags:
    # For OpenTelemetry
    telemetry.sdk.name:
      entityTagName: instrumentation.provider

goldenTags:
- mysql.port
- mysql.version
- mysql.edition
- mysql.hostname
- mysql.clusterNodeType

configuration:
  entityExpirationTime: DAILY
  alertable: true

dashboardTemplates:
  # This should match the entity created from the ohi in the infra pipeline
  newRelic:
    template: newrelic_dashboard.json
  # otel receiver
  opentelemetry:
    template: opentelemetry_dashboard.json

ownership:
  primaryOwner:
    teamName: "Database Integrations"
